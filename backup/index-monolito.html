<style>
/* ═══════════════════════════════════════════════════════════════
   HALF · sistema de diseño
   ground  gris frío de taller     ink  azul-negro
   signal  azul de instrumento — sólo marca la medida válida
   tipos   DM Mono (telemetría) · Archivo (dato)
   ═══════════════════════════════════════════════════════════════ */
:root{
  --ground:#DFE1DA;
  --ink:#0F1211;
  --signal:#2438F5;
  --hair:rgba(15,18,17,.22);
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sans:"Archivo",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
[data-theme="dark"]{
  --ground:#0F1211;
  --ink:#DDE0D9;
  --signal:#5468FF;
  --hair:rgba(221,224,217,.22);
  color-scheme:dark;
}
/* destello: un solo fotograma en negativo al fallar */
[data-theme="light"].flash{--ground:#0F1211;--ink:#DDE0D9;--hair:rgba(221,224,217,.22)}
[data-theme="dark"].flash{--ground:#DFE1DA;--ink:#0F1211;--hair:rgba(15,18,17,.22)}
.flash body,.snap body{transition:none}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--ground);color:var(--ink);
  font-family:var(--mono);font-weight:400;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;touch-action:none;
  transition:background .35s ease,color .35s ease;
}
#app{
  position:fixed;inset:0;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;
  padding:max(14px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));
}

/* ── telemetría superior ─────────────────────────────────────── */
.hud{
  display:flex;align-items:center;justify-content:space-between;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  padding-bottom:12px;border-bottom:1px solid var(--hair);
}
.hud b{font-weight:500}
.lives{display:flex;gap:6px;align-items:center}
.lives i{display:block;position:relative;width:3px;height:14px}
.lives i::before{content:"";position:absolute;inset:0;background:var(--ink);
  transition:opacity .32s,transform .32s cubic-bezier(.2,.8,.2,1);transform-origin:center}
.lives i.off::before{opacity:.16;transform:scaleY(.4)}
.lives i.new::before{opacity:0;transform:scaleY(0)}
.lnk{
  font:inherit;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);background:none;border:0;padding:2px 0;cursor:pointer;
  border-bottom:1px solid var(--ink);
}
.lnk[hidden]{display:none}
.lnk:focus-visible,.btn:focus-visible,.tag:focus-visible{outline:2px solid var(--signal);outline-offset:3px}

/* ── escenario ───────────────────────────────────────────────── */
.stage{position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* vidas: dentro del escenario, arriba a la izquierda, enfrentadas
   a la cuenta atrás que se dibuja en el lienzo arriba a la derecha */
.stage .lives{position:absolute;left:12px;top:19px;z-index:2}
/* consejo del tutorial: banda superior del escenario, fuera del paso
   de la figura, que ocupa la franja central                        */
.tip{
  position:absolute;left:0;right:0;top:0;margin:0 auto;max-width:34ch;
  padding:6px 16px 0;text-align:center;pointer-events:none;
  font-size:12px;line-height:1.55;opacity:.75;
}
.tip.on{animation:capIn .38s cubic-bezier(.2,.8,.2,1)}
/* elogio: aparece en el centro del escenario y se va solo */
.hype{
  position:absolute;left:0;right:0;top:50%;padding:0 22px;text-align:center;
  font-family:var(--sans);font-weight:600;line-height:1.02;letter-spacing:-.03em;
  font-size:calc(clamp(30px,10vw,52px) * var(--k,1));
  color:var(--signal);opacity:0;pointer-events:none;
  transform:translateY(-50%);
}
.hype.on{animation:hype .8s cubic-bezier(.2,.8,.2,1) .1s both}
/* el fallo también habla, y sin azul: el azul sólo marca el acierto.
   Pero la balanza se vence por el centro, justo bajo este texto, y se
   dibuja en tinta plana: cualquier color fijo se perdería encima. El
   negativo se calcula contra lo que haya detrás — blanco literal, no
   una variable: con «difference» es lo que garantiza la inversión en
   los dos temas y también sobre la figura.                          */
.hype.miss{color:#fff;mix-blend-mode:difference}
@keyframes hype{
  0%{opacity:0;transform:translateY(-50%) scale(.94)}
  20%{opacity:1;transform:translateY(-50%) scale(1)}
  68%{opacity:1;transform:translateY(-50%) scale(1)}
  100%{opacity:0;transform:translateY(-50%) scale(1.03)}
}

/* ── lectura inferior ────────────────────────────────────────── */
.readout{min-height:118px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
.num{
  font-family:var(--sans);font-weight:600;
  font-size:clamp(50px,17vw,86px);line-height:.86;letter-spacing:-.045em;
  opacity:0;transform:translateY(6px);transition:opacity .18s ease,transform .18s ease;
  position:relative;align-self:flex-start;
}
.num.on{opacity:1;transform:none}
.num small{font-size:.34em;font-weight:400;letter-spacing:0;vertical-align:.9em;margin-left:.1em;opacity:.5}
.num::after{content:"";position:absolute;left:-4px;right:-4px;top:52%;height:1px;background:var(--ink);
  transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.num.void::after{transform:scaleX(1)}
.num.valid{color:var(--signal)}
.cap{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.55;
  border-top:1px solid var(--hair);padding-top:11px;transition:color .2s}
.cap.hit{color:var(--signal);opacity:1;animation:capIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes capIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ── pantallas ───────────────────────────────────────────────── */
.screen{
  position:fixed;inset:0;background:var(--ground);z-index:5;
  display:flex;flex-direction:column;justify-content:center;gap:22px;
  padding:max(22px,env(safe-area-inset-top)) 26px max(26px,env(safe-area-inset-bottom));
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
}
.screen[hidden]{display:none}
/* la ayuda ocupa en la portada el mismo hueco que «Cerrar» en las
   demás pantallas: esquina superior derecha, sobre el margen. Fuera
   del flujo, para no abrir un hueco en la pila ni pelearse con el
   logotipo, que en un móvil ocupa todo el ancho.                   */
#go-tutor{position:absolute;top:max(22px,env(safe-area-inset-top));right:26px}
/* logotipo dibujado: la barra de la H y el brazo del 7 están
   centrados en y=51, justo donde pasa la línea de corte          */
.mark{position:relative;display:block;line-height:0;align-self:flex-start;width:min(86vw,460px)}
.mark svg{display:block;width:100%;height:auto}
.mark::after{content:"";position:absolute;top:51%;left:-40vw;right:-40vw;height:2px;
  background:var(--signal);transform:translateY(-50%)}
.mark--sm{width:150px}
.mark--sm::after{display:none}
.headline{
  font-family:var(--sans);font-weight:600;
  font-size:clamp(52px,17vw,96px);line-height:.82;letter-spacing:-.05em;
  position:relative;align-self:flex-start;
}
.headline::after{content:"";position:absolute;top:47%;left:-40vw;right:-40vw;height:1px;background:var(--signal)}
.lede{font-size:13px;line-height:1.65;max-width:30ch;opacity:.72}
.row--left{justify-content:flex-start;gap:22px;flex-wrap:wrap}
.btn{
  font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink);background:none;border:1px solid var(--ink);
  padding:16px 22px;cursor:pointer;align-self:stretch;line-height:1.4;
  transition:background .18s,color .18s;
}
.btn:active{background:var(--ink);color:var(--ground)}
.btn[hidden]{display:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.stats{display:flex;flex-direction:column}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-top:1px solid var(--hair);padding:12px 0}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.55}
.val{font-family:var(--sans);font-weight:500;font-size:26px;letter-spacing:-.02em;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* la mejor marca lleva nombre: más discreta que las cifras sueltas */
#best-val{font-size:18px}

/* ── tabla de marcas ─────────────────────────────────────────── */
.tbl{list-style:none;display:flex;flex-direction:column}
.tbl li{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:14px;align-items:baseline;
  border-top:1px solid var(--hair);padding:10px 0;font-size:12px}
.tbl li.me{color:var(--signal)}
.tbl .r{opacity:.4}
.tbl .n{font-weight:500;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .l{font-family:var(--sans);font-weight:500;font-size:17px;letter-spacing:-.01em}
.tbl .a{opacity:.55;font-size:11px;min-width:52px;text-align:right}
.empty{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.4;border-top:1px solid var(--hair);padding-top:12px}

/* ── entrada de nombre ───────────────────────────────────────── */
.entry{display:flex;align-items:flex-end;gap:16px;border-top:1px solid var(--hair);padding-top:14px}
.tag{
  font-family:var(--sans);font-weight:500;font-size:20px;letter-spacing:-.01em;
  flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--ink);
  color:var(--ink);padding:0 0 6px;
}
.tag::placeholder{font-family:var(--mono);font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;opacity:.32}
.note{font-size:11px;letter-spacing:.1em;line-height:1.6;opacity:.5;text-transform:uppercase}
/* conmutador de tema: disco partido por su diámetro, como el juego.
   Al cambiar gira 180º y los dos colores intercambian su sitio.   */
.tt{
  width:26px;height:26px;flex:none;padding:0;cursor:pointer;
  border:1px solid var(--ink);border-radius:50%;background:none;
  position:relative;overflow:hidden;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .35s;
}
.tt::before{content:"";position:absolute;left:0;right:0;bottom:0;height:50%;background:var(--ink)}
.tt::after{content:"";position:absolute;left:-1px;right:-1px;top:50%;height:1px;
  background:var(--signal);transform:translateY(-.5px)}
[data-theme="dark"] .tt{transform:rotate(180deg)}
.tt:focus-visible{outline:2px solid var(--signal);outline-offset:3px}

/* selector de tiempo */
.seg{display:flex;border:1px solid var(--hair)}
.seg button{font:inherit;font-size:11px;letter-spacing:.1em;min-width:40px;padding:8px 0;
  background:none;border:0;border-left:1px solid var(--hair);color:var(--ink);opacity:.45;cursor:pointer;
  transition:background .18s,color .18s,opacity .18s}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:var(--ground);opacity:1}
#scr-ask{z-index:7;justify-content:center}
#scr-scores{z-index:8;justify-content:flex-start;gap:18px}
.toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));z-index:9;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--ground);padding:12px 20px;max-width:86vw;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-align:center;
  transition:opacity .24s,transform .24s cubic-bezier(.2,.8,.2,1);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.statlink{width:100%;font:inherit;color:inherit;background:none;border:0;
  border-top:1px solid var(--hair);cursor:pointer;text-align:left}
.statlink .u{border-bottom:1px solid var(--ink);padding-bottom:2px}
.btn--ghost{border-color:var(--hair)}
.btn--solid{background:var(--ink);color:var(--ground)}
.btn--sm{font-size:11px;letter-spacing:.18em;padding:13px 20px}
.btn--solid:active{background:none;color:var(--ink)}
.free{display:flex;flex-direction:column;gap:12px}
/* separador con rótulo: la línea se abre a los lados del texto */
.sep{display:flex;align-items:center;gap:14px;margin-top:4px;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.55}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--hair)}
.record{font-family:var(--sans);font-weight:600;letter-spacing:-.02em;color:var(--signal);
  font-size:clamp(26px,8vw,40px);line-height:1;animation:capIn .45s cubic-bezier(.2,.8,.2,1)}
.daily{display:flex;flex-direction:column;gap:11px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   1 · CONFIGURACIÓN
   ═══════════════════════════════════════════════════════════════ */
const CONFIG = {
  lives: 3,               // vidas iniciales
  maxLives: 5,            // tope absoluto
  streak: 7,              // aciertos seguidos que dan una vida
  tolerance: 7,          // % de error máximo para superar el nivel
  minSwipe: 26,          // px mínimos de trazo
  hold: { ok: 800, fail: 1150 },
  targetArea: Math.PI,
  /* techo de dificultad: la partida es infinita, pero los parámetros
     dejan de crecer aquí. Más allá es resistencia, no ruleta.      */
  ceiling: { rot: .45, drift: 34, ghost: 700 },
  timers: [0, 10, 5, 3], // segundos por figura · 0 = sin límite
  dailyTimers: [0, 10, 5], // regla de tiempo que puede tocar en el reto
  keep: 100,             // marcas históricas guardadas
  nameMax: 14
};

const STAGES = [
  { from: 1,  shapes:["square","circle","triangle"],              rot:0,   drift:0  },
  { from: 3,  shapes:["ngon","convex","triangle"],                rot:.14, drift:0  },
  { from: 5,  shapes:["star","ell","cross","convex"],             rot:.22, drift:0  },
  { from: 7,  shapes:["blob","chevron","comb","star"],            rot:.30, drift:16 },
  { from: 10, shapes:["convex","blob","comb","chevron","ell"],    rot:.40, drift:26, outline:true },
  { from: 13, shapes:["multi","comb","blob","star","ell"],        rot:.10, drift:0,  ghost:1500 }
];

function levelConfig(n){
  let s = STAGES[0];
  for (const st of STAGES) if (n >= st.from) s = st;
  const over = Math.max(0, n - 16), C = CONFIG.ceiling;
  return {
    shapes : s.shapes,
    rot    : Math.min(C.rot,   (s.rot   || 0) * (1 + over * .05)),
    drift  : Math.min(C.drift, (s.drift || 0) * (1 + over * .05)),
    outline: !!s.outline,
    ghost  : s.ghost ? Math.max(C.ghost, s.ghost - over * 60) : 0
  };
}

/* Práctica guiada: cuatro figuras quietas y sin reloj, una idea cada
   una. `guide` enseña de entrada una línea que sí parte la figura en
   dos; en los pasos que no la traen, aparece sólo si fallas. `ang` es
   la dirección de esa línea, no su altura: la altura se calcula para
   que el reparto sea exacto, así que el consejo nunca miente.      */
const TUTOR = [
  { shape:"circle",   tip:"tut1", guide:true,  ang:0        },
  { shape:"square",   tip:"tut2", guide:true,  ang:Math.PI/4 },
  { shape:"triangle", tip:"tut3", guide:false, ang:0        },
  { shape:"ell",      tip:"tut4", guide:false, ang:0, rot:.18 }
];

/* ═══════════════════════════════════════════════════════════════
   2 · IDIOMAS
   ═══════════════════════════════════════════════════════════════ */
const L = {
  es: {

    scores:"Mejores marcas", empty:"Sin marcas registradas",
    app:"Aplicación", install:"Instalar", installLong:"Instalar la aplicación",
    installed:"Instalada en el dispositivo",
    hintIOS:"En iPhone o iPad: Compartir → Añadir a pantalla de inicio",
    hintHTTP:"Abre la página desde un servidor https para poder instalarla",
    language:"Idioma", theme:"Tema", light:"Claro", dark:"Oscuro",
    howTo:"Cómo se juega", skip:"Saltar", practice:"Práctica",
    tutorDone:"Ya sabes jugar",
    tut1:"Desliza el dedo de un lado a otro de la figura. La línea de puntos es un corte válido.",

    accuracy:"average accuracy", cardDaily:"Challenge", cardFree:"Free play",
    timeLimit:"Time per shape", noLimit:"No limit", timeout:"Time up",
    cancel:"Cancel",
    cutOk:"Valid cut", cutFail:"Out of tolerance", err:"% error",
    end:"END", levelWord:"LEVEL",
    reached:"Level reached", avg:"Average accuracy", bestCut:"Best cut",
    yourName:"Your name", save:"Save", saved:"Score saved",
    savedSession:"Saved for this session only", noTable:"This run misses the table",
    scores:"Best scores", empty:"No scores yet",
    app:"App", install:"Install", installLong:"Install the app",
    installed:"Installed on this device",
    hintIOS:"On iPhone or iPad: Share → Add to Home Screen",
    hintHTTP:"Open the page from an https server to install it",
    language:"Language", theme:"Theme", light:"Light", dark:"Dark",
    howTo:"How to play", skip:"Skip", practice:"Practice",
    tutorDone:"You're ready",
    tut1:"Swipe across the shape, from one side to the other. The dotted line is a valid cut.",
    tut2:"Up to 7% error is allowed. When you cut, the figure below tells you how far off you were.",
    tut3:"No line this time. In a triangle, half is not at half the height.",
    tut4:"This one spins. Wait until it looks right and cut.",
    tutRetry:"That cut is over 7%. Follow the dotted line and try again.",
    savedScores:"Saved scores", wipe:"Clear", wipeAsk:"Clear every saved score?",
    storeOk:"Scores are saved on this device.",
    storeNo:"This browser blocks storage: scores last for this session only.",
    read:e => e + "% error"
  }
};
let lang = "es";
const T = k => L[lang][k];

/* ═══════════════════════════════════════════════════════════════
   3 · GEOMETRÍA
   ═══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2;

/* Todo el azar del juego pasa por RNG. En modo libre es Math.random;
   en el reto diario es un generador sembrado con la fecha, así que la
   secuencia de figuras es idéntica para todo el mundo ese día.      */
let RNG = Math.random;
function mulberry32(a){
  return function(){
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hashStr = str => {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
  return h >>> 0;
};
const dayKey = (offset = 0) => {
  const d = new Date(); d.setDate(d.getDate() + offset);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
};
/* cada día tiene su propia regla de tiempo, sorteada por la fecha */
const dayTimer = key => CONFIG.dailyTimers[hashStr("t" + key) % CONFIG.dailyTimers.length];

const rnd  = (a,b) => a + RNG() * (b - a);
const rndI = (a,b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(RNG() * a.length)];
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;

const area = p => { let a = 0; for (let i = 0, n = p.length; i < n; i++){ const q = p[(i+1)%n]; a += p[i].x*q.y - q.x*p[i].y; } return a/2; };
const centroid = p => {
  let a = 0, x = 0, y = 0;
  for (let i = 0, n = p.length; i < n; i++){
    const b = p[(i+1)%n], f = p[i].x*b.y - b.x*p[i].y;
    a += f; x += (p[i].x + b.x) * f; y += (p[i].y + b.y) * f;
  }
  a *= .5; return a ? { x: x/(6*a), y: y/(6*a) } : { x:0, y:0 };
};

/* Recorte por semiplano (Sutherland–Hodgman). Válido también en
   polígonos cóncavos: los puentes degenerados aportan área nula. */
function clipHalf(poly, P, N, sign){
  const out = [], n = poly.length;
  for (let i = 0; i < n; i++){
    const a = poly[i], b = poly[(i+1)%n];
    const da = sign * ((a.x-P.x)*N.x + (a.y-P.y)*N.y);
    const db = sign * ((b.x-P.x)*N.x + (b.y-P.y)*N.y);
    if (da >= 0) out.push(a);
    if ((da > 0 && db < 0) || (da < 0 && db > 0)){
      const t = da / (da - db);
      out.push({ x: a.x + (b.x-a.x)*t, y: a.y + (b.y-a.y)*t });
    }
  }
  return out;
}

function evaluate(parts, P, N){
  const A = [], B = []; let aA = 0, aB = 0;
  for (const p of parts){
    const a = clipHalf(p, P, N,  1), b = clipHalf(p, P, N, -1);
    if (a.length > 2){ A.push(a); aA += Math.abs(area(a)); }
    if (b.length > 2){ B.push(b); aB += Math.abs(area(b)); }
  }
  const tot = aA + aB;
  return { A, B, aA, aB, err: tot > 0 ? Math.abs(aA - aB) / tot * 100 : 100 };
}

/* Corte que parte de verdad la figura en dos, en la dirección `ang`.
   Se busca la altura por bisección: pasar por el centro de áreas no
   basta — en un triángulo, una recta cualquiera por el baricentro se
   va hasta el 11 % y la pista del tutorial suspendería su propio
   examen.                                                          */
function bisector(parts, ang){
  const N = { x: -Math.sin(ang), y: Math.cos(ang) };
  const c = partsCentroid(parts);
  let R = 1;
  for (const p of parts) for (const v of p) R = Math.max(R, Math.hypot(v.x - c.x, v.y - c.y));
  let lo = -R, hi = R, P = c;
  for (let i = 0; i < 22; i++){
    const mid = (lo + hi) / 2;
    P = { x: c.x + N.x*mid, y: c.y + N.y*mid };
    const r = evaluate(parts, P, N);
    if (r.aA > r.aB) lo = mid; else hi = mid;
  }
  return { P, N, R };
}

/* ═══════════════════════════════════════════════════════════════
   4 · CATÁLOGO DE FIGURAS
   ═══════════════════════════════════════════════════════════════ */
const ring = (n, r, phase=0) => Array.from({length:n}, (_,i) => {
  const a = phase + i*TAU/n, k = typeof r === "function" ? r(a,i) : r;
  return { x: Math.cos(a)*k, y: Math.sin(a)*k };
});

const SHAPES = {
  circle:   () => [ ring(160, 1) ],
  square:   () => [ ring(4, 1, Math.PI/4) ],
  triangle: () => [ ring(3, 1, -Math.PI/2) ],
  ngon:     () => [ ring(rndI(5,8), 1, rnd(0,TAU)) ],

  convex: () => {
    const n = rndI(5,9), p = [];
    for (let i = 0; i < n; i++){
      const a = i*TAU/n + rnd(-.22,.22)*TAU/n, r = rnd(.6, 1.1);
      p.push({ x: Math.cos(a)*r, y: Math.sin(a)*r });
    }
    return [p];
  },

  star: () => {
    const n = rndI(5,7), k = rnd(.38,.6), p = [];
    for (let i = 0; i < n*2; i++){
      const a = i*Math.PI/n, r = i % 2 ? k : 1;
      p.push({ x: Math.cos(a)*r, y: Math.sin(a)*r });
    }
    return [p];
  },

  blob: () => {
    const f1 = rnd(0,TAU), f2 = rnd(0,TAU), f3 = rnd(0,TAU);
    return [ ring(180, a => 1 + .22*Math.sin(3*a+f1) + .12*Math.sin(5*a+f2) + .045*Math.sin(7*a+f3)) ];
  },

  ell: () => {
    const w = rnd(.5,.85);
    return [[ {x:-.9,y:-.9},{x:.9,y:-.9},{x:.9,y:-.9+w},{x:-.9+w,y:-.9+w},{x:-.9+w,y:.9},{x:-.9,y:.9} ]];
  },

  cross: () => {
    const w = rnd(.28,.42);
    return [[ {x:-w,y:-1},{x:w,y:-1},{x:w,y:-w},{x:1,y:-w},{x:1,y:w},{x:w,y:w},
              {x:w,y:1},{x:-w,y:1},{x:-w,y:w},{x:-1,y:w},{x:-1,y:-w},{x:-w,y:-w} ]];
  },

  chevron: () => {
    const d = rnd(.35,.75);
    return [[ {x:-.7,y:-1},{x:.1,y:-1},{x:.95,y:0},{x:.1,y:1},{x:-.7,y:1},{x:-.7+d,y:0} ]];
  },

  comb: () => {
    const t = rndI(3,4), w = 2/(2*t-1), base = rnd(-.35,-.1), p = [{x:-1,y:-.9},{x:1,y:-.9}];
    for (let i = t-1; i >= 0; i--){
      const xr = -1 + (2*i+1)*w, xl = -1 + 2*i*w;
      p.push({x:xr,y:.9},{x:xl,y:.9});
      if (i > 0) p.push({x:xl,y:base},{x:-1+(2*i-1)*w,y:base});
    }
    return [p];
  },

  /* Piezas separadas: el área ya no está en un solo bloque. */
  multi: () => {
    const a = pick([ ring(120,1), ring(4,1,Math.PI/4), ring(3,1,-Math.PI/2) ]);
    const b = pick([ ring(120,1), ring(4,1,Math.PI/4), ring(6,1) ]);
    const ka = rnd(.5,.7), kb = rnd(.35,.55), dy = rnd(-.3,.3);
    return [
      a.map(v => ({ x: v.x*ka - .8, y: v.y*ka - dy })),
      b.map(v => ({ x: v.x*kb + .95, y: v.y*kb + dy }))
    ];
  }
};

/* centro de masas de un conjunto de polígonos */
function partsCentroid(list){
  let a = 0, x = 0, y = 0;
  for (const p of list){ const ar = Math.abs(area(p)), c = centroid(p); a += ar; x += c.x*ar; y += c.y*ar; }
  return a ? { x: x/a, y: y/a } : { x:0, y:0 };
}

function normalize(parts){
  let tot = 0, cx = 0, cy = 0;
  for (const p of parts){ const a = Math.abs(area(p)), c = centroid(p); tot += a; cx += c.x*a; cy += c.y*a; }
  cx /= tot; cy /= tot;
  const s = Math.sqrt(CONFIG.targetArea / tot);
  return parts.map(p => p.map(v => ({ x:(v.x-cx)*s, y:(v.y-cy)*s })));
}

/* ═══════════════════════════════════════════════════════════════
   5 · DATOS LOCALES · marcas históricas y preferencias
   Orden: nivel alcanzado y, a igualdad, precisión media.
   ═══════════════════════════════════════════════════════════════ */
const cmp = (a,b) => b.lv - a.lv || b.av - a.av || a.ts - b.ts;

const DB = (() => {
  const KEY = "half.v1";
  const ok = (() => { try { localStorage.setItem(KEY+".t","1"); localStorage.removeItem(KEY+".t"); return true; } catch(e){ return false; } })();
  let mem = { records: [], name: "" };
  const read = () => {
    if (!ok) return mem;
    try { return JSON.parse(localStorage.getItem(KEY)) || { records: [], name: "" }; }
    catch(e){ return { records: [], name: "" }; }
  };
  const write = d => { mem = d; if (ok) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} } };
  return {
    persistent: ok,
    list(){ return (read().records || []).slice().sort(cmp); },
    name(){ return read().name || ""; },
    add(r){ const d = read(); d.records = d.records || []; d.records.push(r); d.records.sort(cmp); d.records = d.records.slice(0, CONFIG.keep); d.name = r.n; write(d); },
    clear(){ const d = read(); write({ records: [], name: d.name, lang: d.lang, theme: d.theme }); },
    get(k, dflt){ const v = read()[k]; return v === undefined || v === null ? dflt : v; },
    set(k, v){ const d = read(); d[k] = v; write(d); }
  };
})();

/* Reto diario: una marca por día, la mejor de todos los intentos.
   La racha sube el primer día que juegas si ayer también jugaste.  */
const DAILY = {
  today(){
    const d = DB.get("daily", null);
    return d && d.d === dayKey() ? d : { d: dayKey(), lv: 0, av: 0, tries: 0 };
  },
  streak(){ return DB.get("streak", { last:"", n:0 }); },
  open(){
    const st = DAILY.streak(), key = dayKey();
    if (st.last !== key){
      st.n = st.last === dayKey(-1) ? st.n + 1 : 1;
      st.last = key; DB.set("streak", st);
    }
    return st;
  },
  close(score){
    const cur = DAILY.today();
    cur.tries++;
    const better = score.lv > cur.lv || (score.lv === cur.lv && score.av > cur.av);
    if (better){ cur.lv = score.lv; cur.av = score.av; }
    DB.set("daily", cur);
    return { cur, better };
  }
};

const qualifies = (lv, av) => {
  const l = DB.list();
  return l.length < CONFIG.keep || cmp({lv, av, ts:0}, l[l.length-1]) < 0;
};

function drawTable(el, max, mark){
  const l = DB.list().slice(0, max);
  el.innerHTML = "";
  if (!l.length){ el.innerHTML = '<li class="empty">' + T("empty") + '</li>'; return; }
  l.forEach((r, i) => {
    const li = document.createElement("li");
    if (mark && r.ts === mark) li.className = "me";
    const cell = (c, txt) => { const s = document.createElement("span"); s.className = c; s.textContent = txt; return s; };
    li.append(
      cell("r", String(i+1).padStart(2,"0")),
      cell("n", r.n),
      cell("l", "N." + String(r.lv).padStart(2,"0")),
      cell("a", r.av.toFixed(1) + "%")
    );
    el.appendChild(li);
  });
}

function drawBest(){
  const b = DB.list()[0];
  const el = $("best-val");
  el.textContent = b ? b.n + " · N." + String(b.lv).padStart(2,"0") : "—";
}

/* ═══════════════════════════════════════════════════════════════
   6 · ESTADO E INTERFAZ
   ═══════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
let W = 0, H = 0;

const S = {
  phase: "intro",            // intro · play · result · paused · over
  level: 1, lives: CONFIG.lives, slots: CONFIG.lives, streak: 0, cuts: [], score: null,
  shape: null, cfg: null, rot: 0, rotSpd: 0, maxR: 1,
  t0: 0, last: 0, aim: null, res: null, world: null, pause: null,
  timer: 0, runTimer: 0, limit: 0, lastShape: null, mode: "free",
  step: 0, tutorGuide: false, tutorHelp: false, tutorPending: null,
  refBest: 0, recordShown: false,
  capDesc: { k:"swipe" }, numErr: null, numOk: false
};

const COL = { ink:"#0F1211", signal:"#2438F5" };
function refreshColors(){
  const cs = getComputedStyle(document.body);
  COL.ink    = cs.getPropertyValue("--ink").trim();
  COL.signal = cs.getPropertyValue("--signal").trim();
}
const ink = () => COL.ink, signal = () => COL.signal;

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
/* negativo total durante 80 ms: el golpe, sin añadir un solo elemento */
function flash(){
  if (reduceMotion) return;
  const r = document.documentElement;
  r.classList.add("flash"); refreshColors();
  setTimeout(() => {
    r.classList.add("snap"); r.classList.remove("flash"); refreshColors();
    requestAnimationFrame(() => requestAnimationFrame(() => r.classList.remove("snap")));
  }, 80);
}

const UI = {
  level(){
    if (S.mode === "tutor"){
      $("lvl-label").textContent = T("practice");
      $("lvl").textContent = (S.step + 1) + "/" + TUTOR.length;
      return;
    }
    $("lvl").textContent = String(S.level).padStart(2,"0");
    $("lvl-label").textContent = T(S.mode === "daily" ? "daily" : "level");
  },
  tip(text){
    const el = $("tip");
    el.textContent = text || "";
    el.hidden = !text;
    if (!text) return;
    el.classList.remove("on"); void el.offsetWidth; el.classList.add("on");
  },
  /* las ranuras crecen si se gana una vida y nunca se rehacen desde
     cero: así las transiciones de apagado y encendido se ven         */
  lives(){
    const box = $("lives");
    S.slots = Math.max(CONFIG.lives, S.lives, S.slots);
    while (box.children.length < S.slots){
      const t = document.createElement("i");
      t.className = "new"; box.appendChild(t);
      requestAnimationFrame(() => requestAnimationFrame(() => t.classList.remove("new")));
    }
    while (box.children.length > S.slots) box.lastChild.remove();
    [...box.children].forEach((el, i) => el.classList.toggle("off", i >= S.lives));
  },
  cap(desc){
    S.capDesc = desc;
    const el = $("cap");
    el.textContent = T(desc.k);
    el.classList.toggle("hit", !!desc.hit);
  },
  /* el elogio crece un punto por cada eslabón de la racha */
  hype(text, k, miss){
    const el = $("hype");
    el.textContent = text;
    el.style.setProperty("--k", k);
    el.classList.toggle("miss", !!miss);
    el.classList.remove("on"); void el.offsetWidth; el.classList.add("on");
  },
  num(err, ok){
    const n = $("num");
    S.numErr = err; S.numOk = ok;
    if (err === null){ n.className = "num"; return; }
    n.innerHTML = err.toFixed(1) + "<small>" + T("err") + "</small>";
    n.className = "num on " + (ok ? "valid" : "void");
    $("live").textContent = T("read")(err.toFixed(1)) + " · " + T(ok ? "cutOk" : "cutFail");
  }
};

/* ═══════════════════════════════════════════════════════════════
   7 · CICLO DE JUEGO
   ═══════════════════════════════════════════════════════════════ */
function newLevel(){
  const cfg = levelConfig(S.level);
  S.cfg    = cfg;
  /* nunca la misma figura dos veces seguidas */
  let pool = cfg.shapes;
  if (pool.length > 1 && S.lastShape){
    const f = pool.filter(x => x !== S.lastShape);
    if (f.length) pool = f;
  }
  const name = pick(pool);
  S.lastShape = name;
  S.limit  = S.runTimer;
  S.shape  = normalize(SHAPES[name]());
  S.maxR   = Math.max(...S.shape.flat().map(v => Math.hypot(v.x, v.y)));
  S.rot    = RNG() * TAU;
  S.rotSpd = cfg.rot * (RNG() < .5 ? -1 : 1);
  S.t0     = performance.now();
  S.last   = S.t0;
  S.aim = null; S.res = null; S.phase = "play";
  UI.level(); UI.num(null); UI.cap({ k: cfg.ghost ? "ghost" : "swipe" });
}

/* ── práctica guiada ──────────────────────────────────────────────
   Vive dentro del mismo motor: misma figura, mismo trazo, misma
   medida. Lo único que cambia es que aquí no se pierde nada — se
   repite el paso hasta que sale — y que se puede salir en cualquier
   momento con «Saltar».                                            */
function tutorStep(){
  const st = TUTOR[S.step];
  S.cfg    = { shapes:[st.shape], rot: st.rot || 0, drift: 0, outline: false, ghost: 0 };
  S.shape  = normalize(SHAPES[st.shape]());
  S.maxR   = Math.max(...S.shape.flat().map(v => Math.hypot(v.x, v.y)));
  S.rot    = st.rot ? Math.random() * TAU : 0;
  S.rotSpd = st.rot ? st.rot * (Math.random() < .5 ? -1 : 1) : 0;
  S.limit  = 0;
  S.t0     = performance.now();
  S.last   = S.t0;
  S.aim = null; S.res = null; S.phase = "play";
  S.tutorGuide = !!st.guide || S.tutorHelp;
  /* si se viene de un fallo manda el consejo correctivo: el del paso
     ya se ha leído, y en el 3 y el 4 diría «sin línea» con la línea
     puesta                                                          */
  UI.level(); UI.num(null); UI.cap({ k:"swipe" });
  UI.tip(T(S.tutorHelp ? "tutRetry" : st.tip));
}

function startTutor(pending){
  S.mode = "tutor"; S.tutorPending = pending || null;
  S.step = 0; S.tutorHelp = false;
  RNG = Math.random;
  S.runTimer = 0; S.recordShown = false; S.refBest = 0;
  S.level = 1; S.streak = 0; S.cuts = []; S.score = null; S.pause = null;
  $("scr-intro").hidden = true; $("scr-over").hidden = true;
  $("hype").classList.remove("on");
  armBack();
  tutorChrome(true);
  tutorStep();
}

/* se llega aquí por las dos puertas: terminando el último paso o
   saltando. En ambos casos no se vuelve a ofrecer solo.            */
function finishTutor(completed){
  DB.set("tutorDone", true);
  tutorChrome(false);
  const pending = S.tutorPending;
  S.tutorPending = null; S.res = null; S.aim = null;
  S.phase = "intro"; S.mode = "free";
  if (pending){ start(pending); return; }
  goHome();
  if (completed) toast(T("tutorDone"));
}

function tutorChrome(on){
  $("close-run").hidden = on;      // en la práctica manda «Saltar»
  $("tutor-skip").hidden = !on;
  $("lives").hidden = on;
  if (!on) UI.tip("");
}

function doCut(a, b){
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
  if (len < CONFIG.minSwipe) return;
  const N = { x: -dy/len, y: dx/len };
  const r = evaluate(S.world, a, N);
  const ok = r.err < CONFIG.tolerance;
  S.res = Object.assign(r, { P:a, N, ok, t0: performance.now() });
  S.phase = "result";
  S.cuts.push(100 - r.err);
  UI.num(r.err, ok);

  const tut = S.mode === "tutor";

  if (ok){
    S.streak++;
    UI.cap({ k: "cutOk", hit: true });
    /* en la práctica no hay rachas ni récords que celebrar: sólo el
       elogio, para que el gesto de acertar se reconozca igual       */
    if (tut){
      UI.hype(T("praise")[Math.min(S.step, T("praise").length - 1)], 1);
      if (navigator.vibrate) navigator.vibrate(10);
    }
    /* el récord se bate en el momento de subir por encima de él */
    else if (!S.recordShown && S.refBest > 0 && S.level + 1 > S.refBest){
      S.recordShown = true;
      UI.hype(T("newRecord"), .8);
      if (navigator.vibrate) navigator.vibrate([10,40,10,40,20]);
      if (S.streak + 1 >= CONFIG.streak){ S.streak = 0; if (S.lives < CONFIG.maxLives){ S.lives++; UI.lives(); } }
      return;
    }
    else if (S.streak >= CONFIG.streak){
      S.streak = 0;
      const room = S.lives < CONFIG.maxLives;
      if (room){ S.lives++; UI.lives(); }
      UI.hype(T(room ? "bonus" : "full"), .58);
      if (navigator.vibrate) navigator.vibrate(room ? [12,50,12,50,12] : 10);
    } else {
      UI.hype(T("praise")[S.streak - 1], 1 + (S.streak - 1) * .05);
      if (navigator.vibrate) navigator.vibrate(10);
    }
  } else {
    S.streak = 0;
    UI.cap({ k: "cutFail" });
    /* Math.random y no pick(): el RNG del reto diario está sembrado y
       gastarlo aquí descuadraría la secuencia de figuras al fallar.  */
    const m = T("miss");
    UI.hype(m[Math.floor(Math.random() * m.length)], .62, true);
    if (navigator.vibrate) navigator.vibrate([16,40,16]);
  }

  if (!ok){
    /* la balanza se vence: pivote en el centro de masas, brazo
       horizontal del lado pesado, ángulo según la magnitud del error */
    const heavier = r.aA >= r.aB;
    const heavy = heavier ? r.A : r.B, light = heavier ? r.B : r.A;
    const pv = partsCentroid(S.world), ch = partsCentroid(heavy);
    let R = 1;
    for (const p of S.world) for (const v of p) R = Math.max(R, Math.hypot(v.x-pv.x, v.y-pv.y));
    Object.assign(S.res, {
      heavy, light, pv,
      k    : clamp(r.err / 40, 0, 1),
      lever: clamp((ch.x - pv.x) / (R * .55), -1, 1)
    });
    /* fallar en la práctica no cuesta nada: se repite el paso y, si
       la pista no estaba puesta, a partir de ahora sí                */
    if (tut){ S.tutorHelp = true; UI.tip(T("tutRetry")); }
    else { S.lives--; UI.lives(); }
    flash();
  }
}

function timeUp(){
  S.aim = null;
  S.res = { ok:false, timeout:true, parts:S.world, t0: performance.now() };
  S.phase = "result";
  S.streak = 0; S.lives--;
  UI.lives(); UI.num(null); UI.cap({ k:"timeout" });
  flash();
  if (navigator.vibrate) navigator.vibrate([16,40,16]);
}

function advance(){
  if (S.mode === "tutor"){
    if (!S.res.ok){ tutorStep(); return; }        // mismo paso otra vez
    S.step++; S.tutorHelp = false;
    if (S.step >= TUTOR.length) finishTutor(true);
    else tutorStep();
    return;
  }
  if (S.res.ok){ S.level++; newLevel(); }
  else if (S.lives <= 0) gameOver();
  else newLevel();
}

function gameOver(){
  S.phase = "over";
  const avg  = S.cuts.length ? S.cuts.reduce((a,b)=>a+b,0)/S.cuts.length : 0;
  const best = S.cuts.length ? Math.max(...S.cuts) : 0;
  S.score = { lv: S.level, av: +avg.toFixed(1), best: +best.toFixed(1), saved: false };
  if (S.mode === "daily"){
    const prev = DAILY.today(), r = DAILY.close(S.score);
    S.score.daily  = r.cur;
    S.score.record = r.better && prev.tries > 0;
  } else {
    const prev = DB.list()[0];
    S.score.record = !!prev && cmp({ lv:S.score.lv, av:S.score.av, ts:0 }, prev) < 0;
  }
  paintOver();
  $("scr-over").hidden = false;
  if (pendingReload && swReg) swReg.update().catch(() => {});
}

function paintOver(){
  if (!S.score) return;
  $("over-mark").textContent = S.score.lv > 1
    ? T("levelWord") + " " + String(S.score.lv).padStart(2,"0")
    : T("end");
  $("s-lvl").textContent  = String(S.score.lv).padStart(2,"0");
  $("s-avg").textContent  = S.score.av.toFixed(1) + "%";
  $("s-best").textContent = S.cuts.length ? S.score.best.toFixed(1) + "%" : "—";

  $("again").textContent = T(S.mode === "daily" ? "retry" : "again");
  $("rec-badge").hidden = !S.score.record;

  if (S.mode === "daily"){
    const d = S.score.daily, st = DAILY.streak();
    $("daily-over").hidden = false;
    $("entry").hidden = true; $("entry-note").hidden = true; $("tbl-over").hidden = true;
    $("d-try").textContent    = "#" + d.tries;
    $("d-best").textContent   = "N." + String(d.lv).padStart(2,"0") + " · " + d.av.toFixed(1) + "%";
    $("d-streak").textContent = st.n + " " + T("days");
    return;
  }
  $("daily-over").hidden = true; $("tbl-over").hidden = false;

  const q = !S.score.saved && qualifies(S.score.lv, S.score.av);
  $("entry").hidden = !q;
  $("entry-note").hidden = q;
  if (q) $("name").value = $("name").value || DB.name();
  else if (S.score.saved) $("entry-note").textContent = DB.persistent ? T("saved") : T("savedSession");
  else $("entry-note").textContent = T("noTable");
  drawTable($("tbl-over"), S.score.saved ? 6 : 5, S.score.ts || null);
}

function saveMark(){
  if (!S.score || S.score.saved) return;   // una marca por partida
  const raw = $("name").value.replace(/\s+/g," ").trim().slice(0, CONFIG.nameMax);
  const n = raw || "—";
  const ts = Date.now();
  DB.add({ n, lv: S.score.lv, av: S.score.av, ts });
  S.score.saved = true; S.score.ts = ts;
  paintOver(); drawBest();
}

function goHome(){
  $("scr-over").hidden = true; $("scr-intro").hidden = false;
  S.phase = "intro"; S.score = null; S.pause = null;
  disarmBack();                       // en la portada, atrás vuelve a salir
  $("hype").classList.remove("on");
  drawBest();
  if (pendingReload) applyUpdate();
}

function start(mode){
  const want = mode === "daily" ? "daily" : "free";
  /* la primera vez se enseña antes de jugar, y al terminar (o al
     saltar) se entra en la partida que se había pedido             */
  if (!DB.get("tutorDone", false)){ startTutor(want); return; }
  S.mode = want;
  if (S.mode === "daily"){
    const key = dayKey();
    RNG = mulberry32(hashStr(key));   // misma secuencia para todos
    S.runTimer = dayTimer(key);
    DAILY.open();
    S.refBest = DAILY.today().lv;
  } else {
    RNG = Math.random;
    S.runTimer = S.timer;
    S.refBest = (DB.list()[0] || {}).lv || 0;
  }
  S.recordShown = false;
  S.level = 1; S.lives = CONFIG.lives; S.slots = CONFIG.lives; S.streak = 0;
  S.cuts = []; S.score = null; S.pause = null; S.lastShape = null;
  $("lives").innerHTML = "";
  $("name").value = "";
  $("scr-intro").hidden = true; $("scr-over").hidden = true;
  $("hype").classList.remove("on");
  armBack();
  UI.lives(); newLevel();
}

/* ═══════════════════════════════════════════════════════════════
   8 · DIBUJO
   ═══════════════════════════════════════════════════════════════ */
function resize(){
  const r = stage.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = W*d; cv.height = H*d;
  ctx.setTransform(d,0,0,d,0,0);
}
new ResizeObserver(resize).observe(stage);

const trace = p => { ctx.beginPath(); ctx.moveTo(p[0].x, p[0].y); for (let i=1;i<p.length;i++) ctx.lineTo(p[i].x, p[i].y); ctx.closePath(); };
const ease  = t => 1 - Math.pow(1-t, 3);

function drawParts(parts, mode, alpha, tf){
  ctx.save();
  ctx.globalAlpha = alpha;
  if (tf){
    ctx.translate(tf.x || 0, tf.y || 0);
    if (tf.rot){
      ctx.translate(tf.pivot.x, tf.pivot.y);
      ctx.rotate(tf.rot);
      ctx.translate(-tf.pivot.x, -tf.pivot.y);
    }
  }
  for (const p of parts){
    if (p.length < 3) continue;
    trace(p);
    if (mode === "fill"){ ctx.fillStyle = ink(); ctx.fill(); }
    else {
      ctx.strokeStyle = ink(); ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.lineWidth = mode === "bold" ? 1.75 : 1; ctx.stroke();
    }
  }
  ctx.restore();
}

function drawLine(p0, p1, col, alpha, seg){
  const dx = p1.x - p0.x, dy = p1.y - p0.y, len = Math.hypot(dx,dy) || 1, k = (W + H) * 1.2;
  ctx.save();
  ctx.globalAlpha = alpha; ctx.strokeStyle = col; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(p0.x - dx/len*k, p0.y - dy/len*k);
  ctx.lineTo(p0.x + dx/len*k, p0.y + dy/len*k);
  ctx.stroke();
  if (seg){
    ctx.globalAlpha = .95; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
  }
  ctx.restore();
}

/* pista del tutorial: el corte que sí reparte. A trazos y en el azul
   de la medida válida, para que no se confunda con el trazo propio,
   que va en tinta y continuo. Se recalcula cada fotograma porque la
   figura del último paso gira.                                     */
function drawGuide(alpha){
  const g = bisector(S.world, TUTOR[S.step].ang || 0);
  const ang = TUTOR[S.step].ang || 0;
  const L = g.R * 1.35 + 24;
  const d = { x: Math.cos(ang), y: Math.sin(ang) };
  ctx.save();
  ctx.globalAlpha = alpha * .55; ctx.strokeStyle = signal(); ctx.lineWidth = 1.5;
  ctx.setLineDash([7, 7]);
  ctx.beginPath();
  ctx.moveTo(g.P.x - d.x*L, g.P.y - d.y*L);
  ctx.lineTo(g.P.x + d.x*L, g.P.y + d.y*L);
  ctx.stroke();
  ctx.restore();
}

/* cuenta atrás: aro que se completa y cifra dentro, discretos */
function drawClock(cx, cy, r, p, left){
  ctx.save();
  ctx.lineCap = "butt";
  ctx.strokeStyle = ink(); ctx.globalAlpha = .18; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
  ctx.globalAlpha = left <= 3 ? .85 : .45; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + TAU*clamp(p,0,1)); ctx.stroke();
  ctx.globalAlpha = .7; ctx.fillStyle = ink();
  ctx.font = '500 11px "DM Mono", ui-monospace, monospace';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(String(Math.max(0, Math.ceil(left))), cx, cy + .5);
  ctx.restore();
}

function render(now){
  requestAnimationFrame(render);
  try { paint(now); }
  catch(err){
    console.error(err);
    /* pase lo que pase en el dibujo, la partida sigue avanzando */
    if (S.phase === "result" && !S.res.done){ S.res.done = true; advance(); }
  }
}

function paint(now){
  ctx.clearRect(0,0,W,H);
  if (S.phase !== "play" && S.phase !== "result") return;

  const base  = Math.min(W*.34, H*.30);
  const scale = Math.min(base, (Math.min(W,H)/2 - 22) / S.maxR);
  const ampX  = Math.max(0, W/2 - scale*S.maxR - 16);
  const ampY  = Math.max(0, H/2 - scale*S.maxR - 16);

  if (S.phase === "play"){
    const el = (now - S.t0) / 1000;
    const dt = Math.min(.05, (now - S.last) / 1000); S.last = now;
    S.rot += S.rotSpd * dt;
    const dx = Math.min(S.cfg.drift, ampX), dy = Math.min(S.cfg.drift, ampY);
    const cx = W/2 + Math.sin(el*.62)*dx, cy = H/2 + Math.sin(el*.87 + 1.1)*dy;
    const grow = ease(clamp((now - S.t0)/240, 0, 1));
    const sc = scale * (.94 + .06*grow);
    const c = Math.cos(S.rot), s = Math.sin(S.rot);
    S.world = S.shape.map(p => p.map(v => ({
      x: cx + (v.x*c - v.y*s)*sc,
      y: cy + (v.x*s + v.y*c)*sc
    })));

    if (S.limit){
      const left = S.limit - el;
      if (left <= 0){ timeUp(); return; }
      drawClock(W - 26, 26, 14, 1 - left/S.limit, left);
    }

    let a = grow;
    if (S.cfg.ghost) a *= clamp(1 - ((now - S.t0) - S.cfg.ghost)/650, 0, 1);
    const mode = S.cfg.outline ? "bold" : "fill";

    if (S.aim){
      const p0 = S.aim.a, p1 = S.aim.b;
      const dxl = p1.x - p0.x, dyl = p1.y - p0.y, len = Math.hypot(dxl, dyl) || 1;
      const N = { x:-dyl/len, y:dxl/len };
      const r = evaluate(S.world, p0, N);
      /* una mitad sólida, la otra en contorno: la balanza es la lectura */
      drawParts(r.A, mode, a);
      drawParts(r.B, "thin", a * .5);
      drawLine(p0, p1, ink(), .3, true);
    } else {
      drawParts(S.world, mode, a);
    }
    if (S.mode === "tutor" && S.tutorGuide) drawGuide(a);
  }

  if (S.phase === "result"){
    const t = clamp((now - S.res.t0) / (S.res.ok ? CONFIG.hold.ok : CONFIG.hold.fail), 0, 1);
    const e = ease(t);

    if (S.res.timeout){
      /* sin corte y sin línea: la figura simplemente se va */
      drawParts(S.res.parts, "fill", 1 - t*t, { y: 26*t*t });
    } else {
      const N = S.res.N;
      const dir = { x: S.res.P.x + N.y, y: S.res.P.y - N.x };
      if (S.res.ok){
        /* medida válida: las dos mitades se apartan limpias y en paralelo */
        const d = 26*e;
        drawParts(S.res.A, "fill", 1-e, { x: N.x*d, y: N.y*d });
        drawParts(S.res.B, "fill", 1-e, { x:-N.x*d, y:-N.y*d });
        drawLine(S.res.P, dir, signal(), 1 - e*.4, false);
      } else {
        /* fallo: vuelco de balanza — el lado pesado cae y arrastra el eje */
        const k = S.res.k, a = 1 - Math.pow(t, 2.2);
        const phi = .38 * k * S.res.lever * e;
        drawParts(S.res.heavy, "fill", a, { y:  k*34*t*t, rot: phi, pivot: S.res.pv });
        drawParts(S.res.light, "fill", a, { y: -k*12*e,   rot: phi, pivot: S.res.pv });
        ctx.save();
        ctx.translate(S.res.pv.x, S.res.pv.y); ctx.rotate(phi); ctx.translate(-S.res.pv.x, -S.res.pv.y);
        drawLine(S.res.P, dir, ink(), a * .6, false);
        ctx.restore();
      }
    }
    if (t >= 1 && !S.res.done){ S.res.done = true; advance(); }
  }
}
requestAnimationFrame(render);

/* ═══════════════════════════════════════════════════════════════
   8b · TARJETA COMPARTIBLE
   Lienzo 1080² con los colores del tema activo: logotipo, línea de
   corte, el nivel como cifra protagonista y una tira con la
   precisión de cada corte medida contra el umbral del 7%.
   ═══════════════════════════════════════════════════════════════ */
const WORD_D = "M0 0H56V14H0Z M0 86H56V100H0Z M0 0H15V100H0Z M66 0H81V100H66Z M113 0H128V100H113Z M66 86H128V100H66Z M138 0H196V14H138Z M159.5 0H174.5V100H159.5Z M206 0H221V100H206Z M253 0H268V100H253Z M221 44H253V58H221Z M304 0H318L293 100H278Z M304 0H318L344 100H329Z M293 66H330V80H293Z M354 0H369V100H354Z M354 86H406V100H354Z M400 0H460L455.8 14H400Z M400 44H446.8L442.6 58H400Z M446 0H460L430 100H416Z";
const stamp = () => {
  const d = new Date();
  return String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0") + "." + d.getFullYear();
};
const modeLine = () => (S.mode === "daily" ? T("cardDaily") + " " + stamp() : T("cardFree"))
  + " \u00B7 " + (S.runTimer ? S.runTimer + " s" : T("noLimit"));

function shareText(){
  return "CUTHAL7 \u00B7 " + modeLine() + "\n"
       + T("levelWord") + " " + String(S.score.lv).padStart(2,"0") + " \u00B7 " + S.score.av.toFixed(1) + "%"
       + (/^https?:/.test(location.protocol) ? "\n" + location.href.split("?")[0] : "");
}

async function buildCard(){
  try { await document.fonts.ready; } catch(e){}
  const Z = 1080, PAD = 92, c = document.createElement("canvas");
  c.width = c.height = Z;
  const g = c.getContext("2d");
  const INK = COL.ink, SIG = COL.signal;
  g.fillStyle = getComputedStyle(document.body).getPropertyValue("--ground").trim();
  g.fillRect(0, 0, Z, Z);

  /* logotipo y su línea de corte, de borde a borde */
  const k = 620/462, wy = 120;
  g.save(); g.translate(PAD, wy); g.scale(k, k);
  g.fillStyle = INK; g.fill(new Path2D(WORD_D));
  g.restore();
  g.fillStyle = SIG; g.fillRect(0, wy + 51*k - 2, Z, 4);

  const mono = px => '500 ' + px + 'px "DM Mono", ui-monospace, monospace';
  const sans = px => '600 ' + px + 'px "Archivo", system-ui, sans-serif';
  const track = v => { if ("letterSpacing" in g) g.letterSpacing = v; };
  g.textBaseline = "alphabetic"; g.textAlign = "left"; g.fillStyle = INK;

  track("5px"); g.font = mono(26); g.globalAlpha = .55;
  g.fillText(modeLine().toUpperCase(), PAD, 330);

  track("0px"); g.globalAlpha = 1; g.font = sans(300);
  g.fillText("N." + String(S.score.lv).padStart(2,"0"), PAD - 10, 660);

  g.font = sans(64); g.fillStyle = SIG;
  g.fillText(S.score.av.toFixed(1) + "%", PAD, 772);
  track("5px"); g.font = mono(26); g.fillStyle = INK; g.globalAlpha = .55;
  g.fillText(T("accuracy").toUpperCase(), PAD, 822);

  /* pie: dato secundario y, en el reto, la racha */
  const foot = [ T("bestCut").toUpperCase() + " " + S.score.best.toFixed(1) + "%" ];
  if (S.mode === "daily") foot.push(T("streak").toUpperCase() + " " + DAILY.streak().n);
  g.font = mono(24); g.globalAlpha = .5;
  g.fillText(foot.join("   \u00B7   "), PAD, 930);
  track("0px");
  g.globalAlpha = .18; g.fillStyle = INK; g.fillRect(PAD, 962, Z - PAD*2, 1);

  if (/^https?:/.test(location.protocol)){
    g.globalAlpha = .5; g.font = mono(24); track("4px");
    g.fillText((location.host + location.pathname).replace(/\/index\.html$/,"").toUpperCase(), PAD, 1010);
  }
  return c;
}

let toastT = null;
function toast(msg){
  const el = $("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 2400);
}

async function shareCard(){
  if (!S.score) return;
  const text = shareText();
  let card;
  try { card = await buildCard(); } catch(e){ console.error(e); toast(T("cardFail")); return; }
  const blob = await new Promise(r => card.toBlob(r, "image/png"));
  if (!blob){ toast(T("cardFail")); return; }
  const file = new File([blob], "cuthalf.png", { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file], text }); return; }
    catch(e){ if (e && e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "cuthalf.png"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  try { await navigator.clipboard.writeText(text); } catch(e){}
  toast(T("cardSaved"));
}

  $("ask-q").textContent = question;
  $("ask-yes").textContent = yesLabel;

  $("scr-ask").hidden = false;
  return new Promise(r => { askResolve = r; });

/* selector de idioma: ES · EN, el activo marcado */
function drawLangs(){
  const box = $("lang-intro");
  box.innerHTML = "";
  for (const code of ["es", "en"]){
    const b = document.createElement("button");
    b.textContent = code.toUpperCase();
    b.className = code === lang ? "on" : "";
    b.setAttribute("aria-label", code === "es" ? "Español" : "English");
    b.addEventListener("click", () => { if (code !== lang) applyLang(code); });
    box.appendChild(b);
  }
}

/* selector de tiempo: sólo en la portada */
function drawTimers(){
  const box = $("seg-intro");
  box.innerHTML = "";
  for (const v of CONFIG.timers){
    const b = document.createElement("button");
    b.textContent = v ? String(v) : "∞";
    b.className = v === S.timer ? "on" : "";
    b.setAttribute("aria-label", v ? v + " s" : T("noLimit"));
    b.addEventListener("click", () => { S.timer = v; DB.set("timer", v); drawTimers(); });
    box.appendChild(b);
  }
}

function openScores(){
  drawTable($("tbl-all"), CONFIG.keep, null);
  $("scr-scores").hidden = false;
}

/* congelar y descongelar la partida. El reloj de la figura se mide
   contra S.t0, así que al reanudar se le suma lo que ha durado la
   interrupción: preguntar «¿abandonas?» no puede costar segundos.  */
function pauseRun(){
  if (S.phase !== "play" && S.phase !== "result") return false;
  S.pause = { phase: S.phase, at: performance.now() };
  S.phase = "paused";
  return true;
}
function resumeRun(){
  if (!S.pause) return;
  const d = performance.now() - S.pause.at;
  S.t0 += d; S.last = performance.now();
  if (S.res) S.res.t0 += d;
  S.phase = S.pause.phase; S.pause = null;
}

/* abandonar: se pregunta con la partida detenida y, si se dice que
   no, se sigue donde estaba. Devuelve si se ha salido de verdad.   */
async function quitRun(){
  const mine = pauseRun();
  if (!await ask(T("quitAsk"), T("quitNow"))){
    if (mine) resumeRun();
    return false;
  }
  S.pause = null; S.res = null;
  goHome();
  return true;
}


function applyLang(next){
  lang = next; DB.set("lang", lang);
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T(el.dataset.t); });
  document.querySelectorAll("[data-tp]").forEach(el => { el.placeholder = T(el.dataset.tp); });
  document.querySelectorAll("[data-ta]").forEach(el => { el.setAttribute("aria-label", T(el.dataset.ta)); });
  drawLangs();
  UI.cap(S.capDesc); UI.level();
  if (S.numErr !== null) UI.num(S.numErr, S.numOk);
  drawBest(); drawTimers(); paintOver();
  if (!$("scr-scores").hidden) drawTable($("tbl-all"), CONFIG.keep, null);
  syncTheme(); syncInstall();
}

  /* lo que se atienda aquí se marca como consumido: si no, CloseWatcher
     recogería el mismo Escape y lo volvería a atender por su cuenta   */
  if (e.key === "Escape"){
    if (!$("scr-ask").hidden) closeAsk(false);
    else if (!$("scr-scores").hidden) $("scr-scores").hidden = true;

    else return;                      // sin overlay: que lo recoja quien toque
    e.preventDefault();
    return;
  }
  if (e.key === "Enter" && S.phase === "intro") start();
});

/* ── Gesto de atrás ───────────────────────────────────────────────
   En Android, con la app instalada, «atrás» cerraría la aplicación en
   mitad de una partida. Mientras se juega se atiende ese gesto y se
   responde como al botón de cerrar.

   Por qué CloseWatcher y no el historial: retener el gesto con una
   entrada de historial funciona, pero el sistema ve entonces una
   navegación de verdad y la anima — deslizando la pantalla al arrastrar
   desde el borde izquierdo, que es el borde de «atrás» (por el derecho
   no pasa nada porque no hay entrada hacia adelante). CloseWatcher
   recoge la misma petición de cierre sin tocar el historial: no hay
   navegación que animar, así que no hay deslizamiento.

   El historial queda de plan B para navegadores que aún no lo traen.
   Ahí retirar la entrada no es inmediato — el popstate de
   history.back() llega más tarde —, y si entretanto se empieza otra
   partida el rearme adelantaría al viaje en vuelo; por eso se aplaza
   con backWanted hasta que ese viaje aterriza.                      */
let closeWatch = null;
let backArmed = false, backFlight = 0, backWanted = false;

function armBack(){
  if (closeWatch) return;
  if (window.CloseWatcher){
    try {
      const w = new CloseWatcher();
      w.addEventListener("close", () => {
        if (closeWatch === w) closeWatch = null;
        handleBack();
      });
      closeWatch = w;
      return;
    } catch(e){ closeWatch = null; }         // sin cupo: se sigue por historial
  }
  backWanted = true;
  if (backArmed || backFlight > 0) return;   // ya puesta, o se pondrá al aterrizar
  try { history.pushState({ half:"run" }, ""); backArmed = true; } catch(e){}
}
function disarmBack(){
  if (closeWatch){
    const w = closeWatch; closeWatch = null;
    try { w.destroy(); } catch(e){}          // destroy() no dispara «close»
    return;
  }
  backWanted = false;
  if (!backArmed) return;
  backArmed = false; backFlight++;
  try { history.back(); } catch(e){ backFlight--; }
}

addEventListener("popstate", () => {
  if (backFlight > 0){                         // retroceso provocado por disarmBack
    backFlight--;
    if (backWanted){ backWanted = false; armBack(); }
    return;
  }
  if (!backArmed) return;                      // la entrada no era nuestra
  backArmed = false;
  handleBack();
});

function handleBack(){
  /* se repone antes de actuar: si el gesto acaba en «cancelar», el
     siguiente atrás tiene que seguir encontrando la trampa puesta   */
  armBack();
  if (!$("scr-ask").hidden){ closeAsk(false); return; }
  if (!$("scr-scores").hidden){ $("scr-scores").hidden = true; return; }
  if (S.mode === "tutor"){ finishTutor(false); return; }
  if (S.phase === "play" || S.phase === "result" || S.pause){ quitRun(); return; }
  goHome();                                    // p. ej. desde el final de partida
}

/* ── Actualizaciones ──────────────────────────────────────────────
   El service worker sirve el HTML con red primero, así que al abrir
   con conexión siempre llega la última versión. Si además cambia el
   propio worker, se recarga la página: nunca durante una partida.  */
const APP_VERSION = "2026.08.05";
let swReg = null, pendingReload = false, reloading = false;

function applyUpdate(){
  if (reloading) return;
  if (S.phase === "play" || S.phase === "result" || S.phase === "paused"){
    pendingReload = true;             // se aplicará al terminar
    return;
  }
  reloading = true;
  location.reload();
}

if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  const hadController = !!navigator.serviceWorker.controller;
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js?page=" + encodeURIComponent(location.pathname))
      .then(reg => {
        swReg = reg;
        reg.addEventListener("updatefound", () => {
          const w = reg.installing;
          if (w) w.addEventListener("statechange", () => {
            if (w.state === "installed" && navigator.serviceWorker.controller) w.postMessage?.("skipWaiting");
          });
        });
      })
      .catch(() => {});
  });
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController) applyUpdate();
  });
}

/* al volver a la app (o a la pestaña) se comprueba si hay versión nueva */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (swReg) swReg.update().catch(() => {});
  if (pendingReload) applyUpdate();
});

setTheme(savedTheme ? savedTheme === "dark" : mq.matches, false);
mq.addEventListener("change", e => { if (!DB.get("theme", null)) setTheme(e.matches, false); });
S.timer = DB.get("timer", 0);
applyLang(DB.get("lang", /^(es|ca|gl)/i.test(navigator.language || "") ? "es" : "en"));
UI.lives(); UI.level(); refreshColors(); resize();
</script>
