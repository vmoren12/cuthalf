<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>foto</title>
<meta name="theme-color" content="#DFE1DA">
<link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/game.css"><link rel="stylesheet" href="../css/screens.css">
</head><body>
<script type="module">
/* Retrato de una pantalla, para mirarla con ojos en vez de suponer.
   ?p=scores | libre | intro | juego | ask | fin | fin-libre | cafe |
   tarjeta · ?medir=1 cuenta los anchos                              */
const html = await (await fetch("../index.html")).text();
document.body.innerHTML = html.split("<body>")[1].split("</body>")[0];

/* Las fechas se cuentan desde hoy y no se escriben a mano: ahora las
   tablas se filtran por tramos, y unas fechas fijas irían saliendo
   del mes hasta dejar el retrato en blanco sin que nada esté roto. */
const dia = n => { const d = new Date(); d.setDate(d.getDate() - n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const hace = n => Date.now() - n*86400000;
/* una hora concreta de hoy, no «hace tres horas»: a la una de la
   madrugada eso caería en ayer y el retrato enseñaría una fecha
   donde quiere enseñar una hora                                    */
const hoyALas = (h, m) => { const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime(); };
localStorage.setItem("half.v1", JSON.stringify({
  v:3, name:"VICTOR", tutorDone:true,
  /* una marca vieja a propósito: es lo que hace salir el pie de la
     tabla, que es donde peor se ve si algo se apretuja               */
  /* una de hoy, una de hace días y una sin hora: la columna «cuándo»
     tiene que enseñar las tres formas que sabe decir                */
  records:[{n:"VICTOR",lv:12,av:97.4,pts:1840,tl:0,ts:hoyALas(19,42)},
           {n:"VICTOR",lv:9,av:95.8,pts:960,tl:0,ts:hace(4)},
           {n:"VICTOR",lv:7,av:94.1,pts:610,tl:0,old:1,est:1},
           {n:"VICTOR",lv:4,av:91,pts:280,tl:3,ts:hace(2)}],
  days:{ [dia(0)]:{lv:9,av:96.2,pts:1120,tries:2}, [dia(3)]:{lv:6,av:93,pts:540,tries:1} }
}));
const { S, $ } = await import("../src/state.js");
const { openScores, paintScores, ask } = await import("../src/menu.js");
await import("../src/main.js");

const params = new URL(location).searchParams;
const cual = params.get("p") || "scores";
/* En «siempre» y no en el tramo de por defecto: este retrato existe
   para ver si algo se apretuja, y para eso hace falta la tabla más
   llena, no la más fiel. Con «hoy» el reto enseña una fila y una fila
   no aprieta nada.                                                  */
if (cual === "scores"){ S.scope = "mine"; S.board = "daily"; S.periods = { ...S.periods, daily:"all" }; openScores(); await paintScores(); }
if (cual === "libre"){ S.scope = "mine"; S.board = "free-0"; openScores(); await paintScores(); }
/* La partida en marcha. Los puntos van dentro del escenario, en el
   renglón de las vidas y la cuenta atrás, así que aquí se juega de
   verdad —con reloj y con figura— y no se pinta un decorado: es la
   única forma de ver si las tres cosas están a la misma altura. Sin
   vale, que aquí no hay servidor, pero eso no cambia el dibujo.     */
if (cual === "juego"){
  const { UI } = await import("../src/state.js");
  const { start } = await import("../src/game.js");
  S.timer = 5;
  await start("free");
  S.level = 17; S.points = 12480;
  UI.level(); UI.points(true);
  UI.num(1.3, true); UI.cap({ k:"cutOk", hit:true, gain:187 });
}
if (cual === "ask"){ ask("Elige un nombre para la clasificación mundial", "Guardar", "VICTOR"); }
/* La cuenta atrás, quieta en la tarjeta del tres. Girando no hay
   forma de mirarla, y lo que se comprueba en un retrato es que la
   cifra quepa y que el pliegue caiga por el medio.                  */
if (cual === "cuenta"){
  $("scr-intro").hidden = true;
  $("count").hidden = false;
  $("count-fold").textContent = "3"; $("count-bot").textContent = "3";
  $("count-top").textContent  = "2"; $("count-rise").textContent = "2";
}
/* Y la salida, que es la misma tarjeta con palabra en vez de cifra:
   lo que se mira aquí es que quepa a lo ancho —cuatro signos donde
   cabía uno— y que el pliegue la parta por donde partía el número. */
if (cual === "ya"){
  const { T } = await import("../src/i18n.js");
  $("scr-intro").hidden = true;
  $("count").hidden = false;
  for (const id of ["count-fold", "count-bot", "count-top", "count-rise"]){
    $(id).textContent = T("go");
    $(id).classList.add("word");
  }
}
if (cual === "cafe"){ $("go-donate").click(); }
/* El botón de instalar sólo aparece cuando el navegador ofrece la
   instalación, y eso no pasa en una prueba: aquí se enseña a mano,
   que si no su icono no hay forma de mirarlo.                       */
if (cual === "intro"){ $("install-intro").hidden = false; }

/* La tarjeta de compartir es lo único del juego que nadie ve sin
   compartirlo: se dibuja en un lienzo aparte y se va. Aquí se pega en
   la página para poder mirarla.                                     */
if (cual === "tarjeta"){
  const { buildCard } = await import("../src/share.js");
  S.mode = "daily"; S.runTimer = 0;
  S.score = { lv:9, av:96.2, best:98.9, pts:1120, tl:0 };
  const c = await buildCard();
  c.style.cssText = "width:540px;max-width:100%;display:block;margin:0 auto";
  document.body.innerHTML = ""; document.body.appendChild(c);
}
if (cual === "sobre-scores"){ S.scope="mine"; S.board="daily"; openScores(); await paintScores(); ask("Elige un nombre para la clasificación mundial", "Guardar", "VICTOR"); }

/* El final de partida no se puede retratar jugando: hay que ponerle
   una partida terminada delante. Es la pantalla con más cosas que
   colocar —puntos, cifras, tabla y la oferta de subir—, así que es la
   que más falta hace ver. El vale es de mentira, pero sin él la oferta
   de subir no saldría y es justo lo que se quiere mirar.            */
if (cual === "fin" || cual === "fin-libre" || cual === "fin-subido"){
  const { paintOver } = await import("../src/game.js");
  const { ENVIO } = await import("../src/submit.js");
  S.mode = cual === "fin" ? "daily" : "free";
  S.runTimer = 0; S.cuts = [97.2, 95.8, 98.9];
  S.ticket = "de-mentira"; S.trace = [{}];
  /* el puesto proyectado va puesto a mano: sin él la línea no saldría
     —aquí no hay servidor— y es media razón para mirar la pantalla  */
  S.score = { lv:9, av:96.2, best:98.9, pts:1120, tl:0, saved:false, record:false,
              proy: { pos:12, total:340, mejora:true } };
  if (S.mode === "daily") S.score.daily = { d: dia(0), lv:9, av:96.2, pts:1120, tries:2 };
  $("name").value = "VICTOR";        // lo que deja puesto gameOver()
  /* la partida ya publicada: el botón de subir ha dejado su sitio al
     camino a la tabla. Se marca antes de pintar porque es paintOver
     quien decide si la oferta de subir sigue en pie.                */
  if (cual === "fin-subido") ENVIO.estado = "hecho";
  paintOver();
  $("scr-intro").hidden = true; $("scr-over").hidden = false;
}

if (params.get("medir")){
  const ancho = el => Math.round(el.getBoundingClientRect().width) + " (contenido " + el.scrollWidth + ")";
  const s = $("scr-scores");
  const lineas = [
    "viewport      " + innerWidth,
    "documento     " + document.documentElement.scrollWidth,
    "scr-scores    " + ancho(s)
  ];
  for (const el of s.children) lineas.push("  " + el.tagName.toLowerCase() + "." + (el.className || el.id) + "   " + ancho(el));
  lineas.push("seg-board     " + ancho($("seg-board")));
  lineas.push("  botones     " + [...$("seg-board").children].map(b => Math.round(b.getBoundingClientRect().width)).join("  "));
  lineas.push("seg-span      " + ancho($("seg-span")));
  lineas.push("  botones     " + [...$("seg-span").children].map(b => Math.round(b.getBoundingClientRect().width)).join("  "));
  lineas.push("seg-scope     " + ancho($("seg-scope")));
  lineas.push("rename        " + ancho($("rename")));
  await fetch("/resultado", { method: "POST", body: lineas.join("\n") });
}
document.title = "listo";
</script></body></html>
