<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>arrancando</title>
<meta name="theme-color" content="#DFE1DA">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/game.css">
<link rel="stylesheet" href="../css/screens.css">
<script>
  /* cualquier fallo — de carga o de ejecución — acaba en el título */
  const fail = m => { document.title = "ERROR :: " + m; };
  addEventListener("error", e => {
    fail(e.message ? e.message + " @ " + (e.filename || "?") + ":" + (e.lineno || "?")
                   : "no carga " + (e.target && (e.target.src || e.target.href)));
  }, true);
  addEventListener("unhandledrejection", e => fail("promesa: " + e.reason));
</script>
</head>
<body>
<script type="module">
/* Prueba de humo del juego entero.

   El cuerpo de la página sale del index.html de verdad, no de una
   copia: así esta prueba no puede quedarse desfasada cuando cambie la
   interfaz. Los módulos se cargan después, ya con el DOM puesto (los
   <script> que entran por innerHTML no se ejecutan solos).

   Se juega sin ratón ni dedos: se llama al juego por dentro, se
   cortan figuras a mano y se comprueba lo que queda guardado. Los
   últimos pasos hablan con el servidor de verdad: suben una partida
   y la buscan en la clasificación mundial.

   El resultado de cada paso sale en el título de la página, que es lo
   que se puede leer desde un navegador sin ventanas.                */

/* Esta página juega sola y sube la partida a la clasificación
   mundial. Publicada por error, cada visita sembraría un jugador. El
   servidor la tapa, pero eso depende de una configuración que un día
   puede cambiar o mudarse a otro alojamiento: aquí no se ejecuta
   fuera de casa, y punto.                                           */
if (!["localhost", "127.0.0.1", "[::1]"].includes(location.hostname)){
  document.title = "sólo para desarrollo";
  document.body.textContent = "Esta página es la prueba automática del juego y sólo se ejecuta en local.";
  throw new Error("la prueba no se ejecuta fuera de localhost");
}

const html = await (await fetch("../index.html")).text();
document.body.innerHTML = html.split("<body>")[1].split("</body>")[0];

/* Cada pasada empieza en blanco: con marcas o nombre de la anterior,
   los pasos medirían otra cosa. Lo único que se conserva es la
   identidad, para no sembrar un jugador nuevo en la clasificación
   mundial cada vez que se pasa la prueba.                          */
const antes = JSON.parse(localStorage.getItem("half.v1") || "{}");
const identidad = { v: 3, records: [], days: {}, pid: antes.pid, psecret: antes.psecret };
localStorage.clear();
localStorage.setItem("half.v1", JSON.stringify(identidad));

const { S, $ }                            = await import("../src/state.js");
const { start, doCut, gameOver, saveMark, goHome } = await import("../src/game.js");
const { DB, DAILY, qualifies }            = await import("../src/storage.js");
const { CUT, cutPoints, freeBoard }       = await import("../src/scoring.js");
const { porDelante, inSpan, spanCut, localDays, localRuns, runWhen } = await import("../src/scores.js");
const { normalize, evaluate, bisector }   = await import("../src/geometry.js");
const { SHAPES }                          = await import("../src/shapes.js");
const { setRNG, mulberry32 }              = await import("../src/rng.js");
const { applyLang, openScores, closeScores, paintScores, renameMe,
        handleBack, backHeld }            = await import("../src/menu.js");
const { shareText }                       = await import("../src/share.js");
const { paint }                           = await import("../src/render.js");
const { replay, toShapeSpace }            = await import("../src/replay.js");
const { ME }                              = await import("../src/player.js");
const { ENVIO }                           = await import("../src/submit.js");
const { NET, runSubmit, meFree,
        worldFreeSpan, worldDailySpan, meFreeSpan, meDailySpan } = await import("../src/net.js");
const { startOfToday, monthKey }          = await import("../src/util.js");
await import("../src/main.js");            // arranque, igual que en la página

const log = [];
const step = async (nombre, fn) => {
  try { await fn(); log.push("ok " + nombre); }
  catch(e){ log.push("FALLO " + nombre + ": " + e.message); }
  if (!document.title.startsWith("ERROR")) document.title = log.join(" | ");
};
/* el reloj del navegador sin ventanas va acelerado; esperar por la red
   sí cuesta tiempo del de verdad, que es el que mide el servidor */
const esperar = ms => fetch("/esperar?ms=" + ms).catch(() => {});

/* el corte se mide contra la figura ya proyectada en el lienzo, y de
   eso se encarga el bucle de dibujo: aquí se le pide un fotograma  */
const frame = () => paint(performance.now());
const cut = (dx, dy) => {
  const r = $("stage").getBoundingClientRect();
  doCut({ x: r.width/2 - dx, y: r.height/2 - dy }, { x: r.width/2 + dx, y: r.height/2 + dy });
};
/* el corte que parte de verdad la figura de este nivel, llevado de la
   figura a la pantalla — al revés de lo que hace el juego al apuntar */
const cortePerfecto = angulo => {
  const b = bisector(S.shape, angulo), m = S.tf;
  const P = { x: m.cx + (b.P.x*m.c - b.P.y*m.s)*m.sc, y: m.cy + (b.P.x*m.s + b.P.y*m.c)*m.sc };
  const N = { x: b.N.x*m.c - b.N.y*m.s, y: b.N.x*m.s + b.N.y*m.c };
  doCut({ x: P.x - N.y*90, y: P.y + N.x*90 }, { x: P.x + N.y*90, y: P.y - N.x*90 });
};
const terminarNivel = () => { frame(); paint(S.res.t0 + 5000); };

/* ── geometría ─────────────────────────────────────────────────── */
await step("un diámetro reparte al 50%", () => {
  const r = evaluate(normalize(SHAPES.circle()), { x:0, y:0 }, { x:0, y:1 });
  if (Math.abs(r.err) > 0.5) throw new Error("da " + r.err + "% de error");
});
await step("misma semilla, misma figura", () => {
  setRNG(mulberry32(1234)); const a = JSON.stringify(normalize(SHAPES.blob()));
  setRNG(mulberry32(1234)); const b = JSON.stringify(normalize(SHAPES.blob()));
  if (a !== b) throw new Error("la semilla no reproduce la figura");
});

/* ── partida ───────────────────────────────────────────────────── */
await step("saltar la práctica", () => { DB.set("tutorDone", true); });

await step("juego libre: empieza con el reloj elegido", async () => {
  S.timer = 3;
  await start("free");
  if (S.phase !== "play") throw new Error("no arranca, fase " + S.phase);
  if (S.runTimer !== 3) throw new Error("reloj " + S.runTimer + " en vez de 3");
});
await step("juego libre: cortar", () => {
  frame(); cut(0, 140);
  if (!S.res || !(S.res.err >= 0)) throw new Error("el corte no se ha medido");
});
await step("la marca guarda su reloj y no se mezcla", () => {
  S.cuts = [98.2, 97.1];
  gameOver();
  if (S.score.pts !== S.points) throw new Error("la marca no se lleva los puntos de la partida");
  if (S.score.tl !== 3) throw new Error("la marca no recuerda el reloj");
  if (!shareText()) throw new Error("el texto para compartir sale vacío");
  $("name").value = "SONDA";
  saveMark();                                   // primera vez: guarda el nombre
  if (!ME.tieneNombre()) throw new Error("no ha guardado el nombre");
  if (DB.list("free-3")[0].n !== "SONDA") throw new Error("no ha entrado en la tabla de 3 s");
  if (DB.list("free-0").some(r => r.n === "SONDA")) throw new Error("se ha colado en la de ∞");
  goHome();
});
/* Guardar en casa y publicar no piden lo mismo: lo primero es del
   aparato y se hace solo, lo segundo se ve desde fuera y se pide.   */
await step("la marca se guarda sola, pero no se sube sola", async () => {
  S.timer = 0;
  await start("free");
  frame(); cut(0, 140);
  S.cuts = [96.4];
  const antes = DB.list(freeBoard(0)).length;
  gameOver();
  if (DB.list(freeBoard(0)).length !== antes + 1) throw new Error("no ha guardado la marca en el aparato");
  if (ENVIO.estado !== "") throw new Error("ha subido sin que se lo pidan: " + ENVIO.estado);
  /* y se ofrece subir exactamente cuando se puede: sin vale el
     servidor no podría comprobar la partida                        */
  if ($("keep-up").hidden === !!S.ticket) throw new Error("el botón de subir no cuadra con el vale");
  /* con el nombre delante y ya puesto, que es con el que se sube */
  if ($("name").value !== DB.name()) throw new Error("el nombre no viene puesto: " + $("name").value);
  goHome();
});
await step("reto diario: se juega y cuenta el intento", async () => {
  await start("daily");
  if (S.mode !== "daily") throw new Error("no entra en el reto");
  frame(); cut(0, 140);
  if (!S.res) throw new Error("el corte no se ha medido");
  S.cuts = [95];
  const antes = DAILY.today().tries;
  gameOver();
  if (DAILY.today().tries !== antes + 1) throw new Error("el intento de hoy no se ha contado");
  if (ENVIO.estado !== "") throw new Error("el reto sube solo: " + ENVIO.estado);
  goHome();
});

/* Los puntos son el resultado de cada corte y se ven mientras se
   juega: es lo único que explica por qué cortar deprisa y fino paga
   más que cortar despacio y regular.                               */
await step("los puntos se ganan en el corte y se ven en directo", async () => {
  S.timer = 0;
  await start("free");
  if (S.points !== 0) throw new Error("la partida no empieza a cero: " + S.points);
  frame();
  cortePerfecto(0.4);
  if (!S.res.ok) throw new Error("el corte exacto ha fallado: " + S.res.err.toFixed(2) + "%");
  const ganado = S.points;
  if (ganado <= 0) throw new Error("un corte bueno no ha puntuado");
  if (ganado > CUT.base * CUT.top) throw new Error("un corte pasa de su tope: " + ganado);
  /* el marcador no salta: rueda desde la cifra anterior, así que lo
     que se comprueba es que llega, no que esté ya                   */
  const cifra = ganado.toLocaleString();
  for (let i = 0; i < 12 && $("pts").textContent !== cifra; i++) await esperar(150);
  if ($("pts").textContent !== cifra)
    throw new Error("el marcador no llega a la cifra: " + $("pts").textContent);
  if (!$("cap").textContent.includes("+" + ganado))
    throw new Error("el pie no dice de dónde salen: " + $("cap").textContent);
  /* El marcador vive dentro del escenario y ocupa todo el ancho. Si
     recogiera el puntero se comería los cortes que empiezan arriba,
     que es justo por donde se corta media figura.                   */
  const caja = $("pts-box");
  if (!$("stage").contains(caja)) throw new Error("el marcador se ha salido del escenario");
  if (getComputedStyle(caja).pointerEvents !== "none")
    throw new Error("el marcador se traga los trazos que pasen por él");
  /* un corte por el borde no vale, y lo que no vale no paga */
  terminarNivel(); frame();
  const r = $("stage").getBoundingClientRect();
  doCut({ x: r.width - 2, y: 0 }, { x: r.width - 2, y: r.height });
  if (S.res.ok) throw new Error("un corte por el borde no debería valer");
  if (S.points !== ganado) throw new Error("un fallo ha movido los puntos");
  goHome();
});

/* ── repetición: lo que hace el servidor ───────────────────────── */
await step("un corte mide igual en la pantalla que en la figura", async () => {
  S.timer = 0; await start("free"); frame();
  const P = { x: 100, y: 210 }, N = { x: 0.6, y: 0.8 };
  const enPantalla = evaluate(S.world, P, N).err;
  const m = toShapeSpace(S.tf, P, N);
  const enLaFigura = evaluate(S.shape, m.P, m.N).err;
  if (Math.abs(enPantalla - enLaFigura) > 0.01)
    throw new Error(enPantalla.toFixed(4) + " frente a " + enLaFigura.toFixed(4));
});

await step("repetir la partida da lo mismo que jugarla", async () => {
  S.timer = 0;
  await start("free", 20260811);
  const semilla = S.seed;
  for (const [dx, dy] of [[0,150],[150,0],[60,140],[0,150],[130,60],[0,150]]){
    if (S.phase === "over") break;
    frame(); cut(dx, dy); terminarNivel();
  }
  const nivel = S.level, cortes = S.cuts.slice(), puntos = S.points;
  const r = replay(semilla, S.trace);
  if (!r.ok) throw new Error("rechaza la partida: " + r.reason);
  if (r.level !== nivel) throw new Error("nivel " + nivel + " jugado, " + r.level + " repetido");
  if (r.cuts !== cortes.length) throw new Error("cortes: " + cortes.length + " y " + r.cuts);
  /* y los puntos, clavados: el navegador los suma en directo y el
     servidor los recalcula, y de eso depende que suban las marcas */
  if (r.points !== puntos) throw new Error("puntos " + puntos + " jugados, " + r.points + " repetidos");
  const av = +(cortes.reduce((a,b)=>a+b,0) / (cortes.length||1)).toFixed(1);
  if (Math.abs(r.av - av) > 0.15) throw new Error("precisión " + av + " frente a " + r.av);
  goHome();
});

await step("una partida inventada no cuela", () => {
  const basura = Array.from({length: 12}, () => ({ P:{x:.9,y:.9}, N:{x:1,y:0}, ms: 300 }));
  const r = replay(20260811, basura);
  if (r.level > 3) throw new Error("le da nivel " + r.level + " a cortes de mentira");
  if (!r.over) throw new Error("debería quedarse sin vidas");
});

/* ── clasificaciones locales ───────────────────────────────────── */
await step("cada reloj, su tabla", () => {
  DB.add({ n:"LENTO",  lv: 9, av: 91, pts: 640, tl: 0, ts: 1 });
  DB.add({ n:"RAPIDO", lv: 4, av: 88, pts: 210, tl: 3, ts: 2 });
  if (DB.list("free-0").some(r => r.tl === 3)) throw new Error("las tablas se mezclan");
  if (!qualifies(50, 3)) throw new Error("la tabla de 3 s rechaza lo que le cabe");
  if (freeBoard(10) !== "free-10") throw new Error("mal nombre de tabla");
  if (DB.name() !== "SONDA") throw new Error("guardar una marca ha cambiado el nombre a " + DB.name());
  /* y ordenan por puntos, que es lo que se compite */
  DB.add({ n:"MEJOR", lv: 2, av: 99, pts: 900, tl: 0, ts: 3 });
  if (DB.list("free-0")[0].n !== "MEJOR") throw new Error("la tabla no ordena por puntos");
});
await step("tus días del reto van de mayor a menor y no se suman", () => {
  DB.setDay("2026-01-02", { lv: 4, av: 95, pts: 300, tries: 1 });
  DB.setDay("2026-01-03", { lv: 9, av: 97, pts: 900, tries: 2 });
  DB.setDay("2026-01-04", { lv: 6, av: 96, pts: 600, tries: 1 });
  const lista = DAILY.list();
  const enero = lista.filter(d => d.d.startsWith("2026-01")).map(d => d.pts);
  if (enero.join() !== "900,600,300") throw new Error("no van de mayor a menor: " + enero.join());
  /* jugar tres días no da 1.800 puntos: cada día vale su partida */
  if (lista.some(d => d.pts > 900)) throw new Error("hay días que acumulan");
  if (!lista.some(d => d.d === DAILY.today().d)) throw new Error("el día jugado no consta");
});
/* El puesto que se enseña antes de subir sale de contar cuántos van
   por delante en la tabla del mundo. Sin red no se puede pedir esa
   tabla, pero sí ponerle una delante y comprobar la cuenta.         */
await step("qué puesto ocuparía una partida", () => {
  const tabla = [
    { player_id:"a",  level:15, accuracy:99.0, points:2400 },
    { player_id:"yo", level:14, accuracy:98.0, points:2100 },
    { player_id:"b",  level: 9, accuracy:96.2, points:1200 },
    { player_id:"c",  level: 4, accuracy:91.0, points: 400 }
  ];
  const pos = sc => porDelante(tabla, "yo", sc) + 1;
  if (pos({ pts:9000 }) !== 1) throw new Error("la mejor de todas no queda primera");
  if (pos({ pts:10 })   !== 4) throw new Error("la peor de todas no queda última");
  if (pos({ pts:1201 }) !== 2) throw new Error("un punto más no adelanta");
  /* empate: manda quien llegó antes, y una partida recién terminada
     nunca llegó antes                                               */
  if (pos({ pts:1200 }) !== 3) throw new Error("un empate se cuela por delante");
  /* tu propia fila no cuenta: la sustituyes, no te sumas */
  if (pos({ pts:1500 }) !== 2) throw new Error("te cuentas a ti mismo");
});

await step("la pantalla de clasificaciones", async () => {
  S.scope = "mine"; S.board = "daily";
  openScores();
  if ($("seg-board").children.length !== 5) throw new Error("faltan pestañas");
  if ($("seg-scope").children.length !== 2) throw new Error("falta el conmutador mundo/tú");
  /* aquí sólo se compara: tablas y nada más, sin el resumen de tu día */
  if ($("today-box")) throw new Error("sigue el resumen del día en las clasificaciones");
  /* la primera columna se entiende porque la tabla dice qué es cada una */
  const cab = $("tbl-all").querySelector("li.head");
  if (!cab) throw new Error("la tabla no lleva cabecera");
  if (!/Día/.test(cab.textContent) || !/Puntos/.test(cab.textContent))
    throw new Error("la cabecera no nombra las columnas: " + cab.textContent);
  /* en tu tabla la segunda columna es cuándo jugaste, no quién eres:
     el nombre sería el tuyo en todas las filas                      */
  S.board = "free-3"; await paintScores();
  const cabLibre = $("tbl-all").querySelector("li.head").textContent;
  if (!/Cuándo/.test(cabLibre)) throw new Error("el juego libre no nombra la columna: " + cabLibre);
  if (/Jugador/.test(cabLibre)) throw new Error("tu propia tabla sigue titulando «Jugador»");
  if ($("tbl-all").textContent.includes("LENTO")) throw new Error("la de 3 s enseña marcas de ∞");
});

/* ── el mundo, de verdad ───────────────────────────────────────── */
await step("hay identidad, y no cambia", () => {
  const id = ME.id(), s = ME.secret();
  if (!/^[0-9a-f-]{36}$/i.test(id)) throw new Error("identificador raro: " + id);
  if (s.length < 20) throw new Error("secreto corto");
  if (ME.id() !== id || ME.secret() !== s) throw new Error("cambian entre llamadas");
});

await step("una partida sube a la clasificación mundial", async () => {
  S.timer = 0;
  await start("free");
  if (!S.ticket) throw new Error("el servidor no ha dado vale");
  for (let i = 0; i < 5; i++){
    frame();
    cortePerfecto(0.3 + i * 0.2);
    if (!S.res.ok) throw new Error("el corte exacto del nivel " + S.level + " ha fallado: " + S.res.err.toFixed(2) + "%");
    terminarNivel();
  }
  if (S.level !== 6) throw new Error("cinco cortes buenos deberían dejarlo en 6, y está en " + S.level);
  await esperar(1600);                       // una partida lleva su tiempo
  gameOver();
  $("keep-up").click();                      // ahora sube porque se lo piden
  for (let i = 0; i < 40 && ENVIO.estado !== "hecho" && ENVIO.estado !== "fallo" && ENVIO.estado !== "sin-red"; i++)
    await esperar(250);
  if (ENVIO.estado !== "hecho"){
    const directo = await runSubmit({ ticket: S.ticket, cuts: S.trace, player: ME.credenciales(), name: ME.name() });
    throw new Error("no ha subido · " + ENVIO.estado + " · net=" + NET.vivo + "/" + NET.ultimoError + " · directo=" + JSON.stringify(directo));
  }
  /* Al subir ya no sale el puesto —una cifra suelta que no llevaba a
     ninguna parte— sino el camino a la tabla, y la confirmación de
     que ha entrado: sin ninguna de las dos, pulsar el botón parecería
     no haber hecho nada.                                            */
  if ($("over-scores").hidden) throw new Error("no ofrece ver las marcas después de subir");
  if ($("entry-note").hidden || !$("entry-note").textContent.trim())
    throw new Error("no dice que la marca haya subido");
  if (!$("keep-up").closest(".keep").hidden) throw new Error("sigue ofreciendo subir lo ya subido");
});

/* y que lleve a la tabla donde acaba de entrar, no a la última que se
   estuviera mirando */
await step("de ahí se va a la tabla en la que acaba de entrar", async () => {
  S.board = "daily"; S.scope = "mine";       // dejarlo en otra cosa a propósito
  $("over-scores").click();
  if ($("scr-scores").hidden) throw new Error("el botón no abre las marcas");
  if (S.board !== freeBoard(S.score.tl)) throw new Error("abre en la tabla equivocada: " + S.board);
  if (S.scope !== "world") throw new Error("abre en «este aparato», y la marca ha subido al mundo");
  closeScores();
});

/* Al subir, el estado del envío se quedaba puesto. La partida
   siguiente heredaba el «marca subida» de ésta —una frase falsa sobre
   una partida que nadie había mandado— y, peor, se quedaba sin el
   botón de subir: paintOver retira la oferta mientras haya un envío
   del que hablar. Empezar una partida borra todo rastro de la
   anterior, y éste era el único que se le escapaba.                 */
await step("la partida siguiente vuelve a ofrecer subir", async () => {
  if (ENVIO.estado !== "hecho") throw new Error("esta prueba tiene que venir de una subida");
  await start("free");
  if (ENVIO.estado !== "") throw new Error("el envío anterior sobrevive a empezar otra partida: " + ENVIO.estado);
  frame(); cortePerfecto(0.3); terminarNivel();
  gameOver();
  if ($("keep").hidden) throw new Error("la partida nueva no ofrece subir");
  if (!$("over-scores").hidden) throw new Error("sigue el botón de marcas de la partida anterior");
  if ($("entry-note").textContent.trim() && !$("entry-note").hidden)
    throw new Error("arrastra la nota de la anterior: " + $("entry-note").textContent);
});

await step("y aparece en la tabla mundial", async () => {
  S.board = "free-0"; S.scope = "world";
  openScores();
  for (let i = 0; i < 40 && /Cargando|Loading/.test($("tbl-all").textContent); i++) await esperar(250);
  const texto = $("tbl-all").textContent;
  if (/Cargando|Loading/.test(texto)) throw new Error("se queda cargando");
  if (!texto.includes("SONDA")) throw new Error("no está la marca recién subida: " + texto.slice(0, 140));
  if (!$("tbl-all").querySelector(".me")) throw new Error("no destaca tu fila");
});

await step("la tabla mundial del reto de hoy responde", async () => {
  S.board = "daily";
  await paintScores();
  const texto = $("tbl-all").textContent;
  if (/Cargando|Loading/.test(texto)) throw new Error("se queda cargando");
  closeScores();
});

/* ── el tramo: hoy · mes · siempre ─────────────────────────────────
   Lo de este aparato se comprueba entero y sin red: es un corte en
   milisegundos y una comparación.                                  */
await step("el tramo sabe qué marcas caen dentro", () => {
  const hoy = spanCut("today"), mes = spanCut("month"), siempre = spanCut("all");
  if (siempre !== 0) throw new Error("«siempre» no puede tener corte");
  if (!(mes <= hoy)) throw new Error("el mes tendría que empezar antes que hoy");

  const ahora    = { ts: Date.now() };
  const anteayer = { ts: Date.now() - 2*24*3600*1000 };
  const sinFecha = { pts: 1 };            // de una versión que no apuntaba la hora

  if (!inSpan(ahora, hoy))       throw new Error("una marca de ahora mismo no cuenta como de hoy");
  if (inSpan(anteayer, hoy))     throw new Error("una de anteayer cuela como de hoy");
  if (!inSpan(anteayer, siempre))throw new Error("«siempre» deja fuera una marca");
  /* sin fecha no se puede afirmar que sea de hoy, y afirmarlo sería
     colocar marcas viejas en un tramo al que no se sabe si pertenecen */
  if (inSpan(sinFecha, hoy))     throw new Error("una marca sin fecha se da por de hoy");
  if (!inSpan(sinFecha, siempre))throw new Error("«siempre» pierde las marcas sin fecha");
});

/* y que las listas lo apliquen de verdad. La sonda acaba de jugar en
   las dos familias, así que hoy tiene que haber algo y cada tramo ha
   de caber en el siguiente.                                        */
await step("cada tramo cabe en el siguiente", () => {
  const dias = s => localDays(s).length, libres = s => localRuns("free-3", 100, null, s).length;
  if (!(dias("today") <= dias("month") && dias("month") <= dias("all")))
    throw new Error("los días del reto no encajan: " + [dias("today"), dias("month"), dias("all")]);
  if (!(libres("today") <= libres("month") && libres("month") <= libres("all")))
    throw new Error("las partidas libres no encajan: " + [libres("today"), libres("month"), libres("all")]);
  if (!dias("today")) throw new Error("se acaba de jugar el reto y hoy sale vacío");
});

/* En tu propia tabla la segunda columna era tu nombre repetido cien
   veces, que no distingue una fila de otra. Ahora dice cuándo se jugó
   cada partida: la hora si es de hoy, el día si no.                 */
await step("en tu tabla, la columna dice cuándo y no quién", () => {
  const ahora = Date.now();
  const deHoy = runWhen(ahora), deOtroDia = runWhen(ahora - 30*3600*1000);
  if (!/\d/.test(deHoy)) throw new Error("una partida de hoy no dice la hora: " + deHoy);
  if (deHoy === deOtroDia) throw new Error("hoy y otro día se leen igual: " + deHoy);
  if (runWhen(undefined) !== "—") throw new Error("una marca sin hora se inventa una fecha");
  if (runWhen(0) !== "—") throw new Error("el instante cero pasa por fecha buena");

  const fila = localRuns("free-3", 100, null, "all")[0];
  if (!fila) throw new Error("la sonda no tiene ninguna partida de 3 s");
  if (fila.n === ME.name()) throw new Error("la tabla sigue enseñando el nombre: " + fila.n);
});

/* El mundo por tramos son cuatro funciones nuevas en Supabase. Si
   esto falla, lo más probable es que el código esté bien y lo que
   falte sea aplicar la migración 0006.                             */
await step("el mundo responde a los tres tramos", async () => {
  const yo = ME.id(), hoy = startOfToday(), mes = monthKey();
  const faltan = [];
  const probar = async (nombre, p) => { if (!Array.isArray(await p)) faltan.push(nombre); };
  await probar("free_span",     worldFreeSpan("free-3", hoy));
  await probar("free_span_me",  meFreeSpan(yo, "free-3", hoy));
  await probar("daily_span",    worldDailySpan(mes));
  await probar("daily_span_me", meDailySpan(yo, mes));
  if (faltan.length)
    throw new Error("el servidor no tiene " + faltan.join(", ") + " (¿falta aplicar la migración 0006?) · " + NET.ultimoError);
});

/* En el móvil, con la app instalada, el gesto de atrás dentro de las
   marcas o de los donativos cerraba la aplicación entera. Las dos se
   abren desde la portada, donde atrás sí tiene que salir, así que
   quien las abre es quien tiene que retener el gesto.               */
await step("atrás, desde las marcas y los donativos, vuelve a la portada", () => {
  goHome();
  if (backHeld()) throw new Error("en la portada, atrás tiene que salir de la app");

  openScores();
  if (!backHeld()) throw new Error("las marcas no retienen atrás: cerraría la app");
  handleBack();
  if (!$("scr-scores").hidden) throw new Error("atrás no cierra las marcas");
  if ($("scr-intro").hidden) throw new Error("atrás no deja la portada a la vista");
  if (backHeld()) throw new Error("ya en la portada, atrás sigue retenido");

  $("go-donate").click();
  if (!backHeld()) throw new Error("los donativos no retienen atrás: cerraría la app");
  handleBack();
  if (!$("scr-donate").hidden) throw new Error("atrás no cierra los donativos");
  if (backHeld()) throw new Error("ya en la portada, atrás sigue retenido");
});

await step("la taza lleva a los donativos, y avisa de que aún no", () => {
  $("go-donate").click();
  if ($("scr-donate").hidden) throw new Error("la taza no abre nada");
  if (!/Próximamente|Coming soon/.test($("scr-donate").textContent))
    throw new Error("no dice que todavía no está");
  $("donate-close").click();
  if (!$("scr-donate").hidden) throw new Error("no se cierra");
});

await step("cambio de idioma", () => {
  applyLang("en");
  if ($("go").textContent !== "Play") throw new Error("no traduce: " + $("go").textContent);
  applyLang("es");
});

/* La portada no lleva cifras: sólo el camino a ellas. */
await step("la portada sólo ofrece las marcas, no las cuenta", () => {
  goHome();
  if ($("best-val")) throw new Error("la portada sigue enseñando una cifra");
  const b = $("open-scores");
  if (b.hidden) throw new Error("falta el botón de las marcas");
  if (!/Mejores marcas/.test(b.textContent)) throw new Error("el botón no se llama: " + b.textContent);
  if (getComputedStyle(b).justifyContent !== "flex-end") throw new Error("el rótulo no va a la derecha");
});

/* Nadie pierde lo que ya tenía guardado: las marcas de antes de los
   puntos se convierten al abrirlas, estimadas y marcadas como tales. */
await step("las marcas viejas se convierten a puntos", () => {
  localStorage.setItem("half.v1", JSON.stringify({ v:2, name:"X", records:[
    { n:"X", lv:11, av:98.5, tl:0, ts:5 }
  ], days:{ "2026-08-09": { lv:7, av:97, tries:2 } } }));
  const r = DB.list("free-0")[0];
  if (!r) throw new Error("se ha perdido la marca vieja");
  if (!(r.pts > 0)) throw new Error("la marca vieja se queda sin puntos");
  if (!r.est) throw new Error("no queda marcada como estimación");
  /* diez cortes buenos al 98,5 % y a ritmo normal, ni más ni menos */
  if (r.pts !== 10 * cutPoints(1.5, CUT.par * 1000)) throw new Error("la estimación no cuadra: " + r.pts);
  if (!(DB.days()["2026-08-09"].pts > 0)) throw new Error("los días viejos se quedan sin puntos");
});

await step("el nombre se cambia sin salir del juego", async () => {
  localStorage.setItem("half.v1", JSON.stringify({ v:3, name:"SONDA", records:[], days:{} }));
  openScores();
  const promesa = renameMe();
  await new Promise(r => setTimeout(r, 50));
  if ($("scr-ask").hidden) throw new Error("no abre la pantalla del juego");
  /* se abre desde las clasificaciones, así que tiene que quedar
     delante de ellas y no detrás */
  const capa = el => +getComputedStyle($(el)).zIndex;
  if (!(capa("scr-ask") > capa("scr-scores")))
    throw new Error("el cuadro queda debajo: " + capa("scr-ask") + " contra " + capa("scr-scores"));
  if (!(capa("toast") > capa("scr-ask")))
    throw new Error("los avisos quedarían tapados por el cuadro");
  if ($("ask-entry").hidden) throw new Error("no enseña la casilla de texto");
  if ($("ask-input").value !== "SONDA") throw new Error("no trae el nombre actual");
  $("ask-input").value = "OTRO NOMBRE";
  $("ask-yes").click();
  await promesa;
  if (DB.name() !== "OTRO NOMBRE") throw new Error("no lo ha guardado: " + DB.name());
  /* y se ve con quién estás compitiendo, sin tener que salir en la tabla */
  if ($("me-row").hidden) throw new Error("no enseña tu nombre en las clasificaciones");
  if ($("me-name").textContent !== "OTRO NOMBRE")
    throw new Error("enseña un nombre viejo: " + $("me-name").textContent);
});

/* y no deja sus marcas en el navegador donde se ha ejecutado */
const dentro = JSON.parse(localStorage.getItem("half.v1") || "{}");
localStorage.clear();
localStorage.setItem("half.v1", JSON.stringify({ v: 3, records: [], days: {}, pid: dentro.pid, psecret: dentro.psecret }));

if (!document.title.startsWith("ERROR")) document.title = log.join(" | ");
/* y se lo cuenta al servidor de pruebas, que es quien puede esperar */
await fetch("/resultado", {
  method: "POST",
  body: document.title.startsWith("ERROR") ? document.title : log.join("\n")
});
</script>
