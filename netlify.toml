# CUTHALF · despliegue
#
# El juego no se compila: lo que hay en el repositorio es lo que se
# sirve. Por eso no hay orden de construcción y el directorio que se
# publica es la raíz.

[build]
  publish = "."
  command = ""

# Del repositorio se publica todo, así que hay que cerrar lo que no es
# el juego. Importa sobre todo tests/: esa página se ejecuta sola al
# abrirla, juega una partida y la sube a la clasificación mundial. Con
# la carpeta abierta, cualquiera que entre siembra un jugador nuevo.
[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404

# Lo demás no es peligroso —el código es público en GitHub— pero no
# pinta nada en un servidor de juego.
[[redirects]]
  from = "/tools/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/build/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/backup/*"
  to = "/index.html"
  status = 404

# Las cabeceras siguen en el fichero _headers, que es donde estaban.
